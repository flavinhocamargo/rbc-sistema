  if(fieis.length>0){
    h+=el("div",{style:"background:"+alertGreenDim+";border-radius:10px;border:0.5px solid "+alertGreen+"44;padding:13px;margin-bottom:16px;display:flex;align-items:center;gap:11px;"},[
      el("i",{"class":"ti ti-star","style":"font-size:20px;color:"+alertGreen+";flex-shrink:0;","aria-hidden":"true"},""),
      el("div",{},[
        el("div",{style:"font-size:13px;font-weight:700;color:"+alertGreen+";margin-bottom:2px;"},fieis.length+" alunos fiéis (pass) ainda sem plano direto — alta prioridade de conversão"),
        el("div",{style:"font-size:11px;color:#1a5c3a;"},"Esses alunos frequentam há meses e não têm plano NextFit. Use os filtros abaixo para agir.")
      ])
    ].join(""));
  }

  // KPI cards
  h+=el("div",{style:"display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;"},[
    mc("Alunos Únicos",""+total,"ti-users",GOLD,"base consolidada das 3 fontes"),
    mc("Candidatos à Migração",""+candidatos.length,"ti-arrow-right",alertGreen,"só nas plataformas pass"),
    mc("Em Múltiplas Fontes",""+multiplas.length,"ti-arrows-exchange",alertBlue,"pass + plano direto"),
    mc("Só Plano Direto",""+soDireto.length,"ti-user-check",blue,"já convertidos no NextFit"),
    mc("Só FDS/Feriados",""+soFdsApenas.length,"ti-moon","#8B5CF6","baixa propensão à migração")
  ].join(""));

  // ── Card de Fusões de Nomes ──────────────────────────────────────────────
  if(fusioesRealizadas.length>0||fusoesPossiveis.length>0){
    var fusId="fus-card-body";
    var fusOpen=window._fusOpen||false;
    h+=el("div",{style:"background:"+card+";border-radius:10px;border:0.5px solid "+brd+";margin-bottom:14px;overflow:hidden;"},[
      // Header clicável
      el("div",{"data-action":"fus-toggle",style:"padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;"},[
        el("div",{style:"display:flex;align-items:center;gap:8px;"},[
          el("i",{"class":"ti ti-git-merge","style":"font-size:15px;color:"+ter+";","aria-hidden":"true"},""),
          el("span",{style:"font-size:12px;font-weight:700;color:"+txt+";"},"Fusões de Nomes"),
          el("span",{style:"font-size:11px;background:"+alertGreen+"22;color:"+alertGreen+";padding:2px 8px;border-radius:10px;font-weight:700;"},fusioesRealizadas.length+" realizadas"),
          fusoesPossiveis.length>0?el("span",{style:"font-size:11px;background:"+alertOrange+"22;color:"+alertOrange+";padding:2px 8px;border-radius:10px;font-weight:700;"},fusoesPossiveis.length+" para revisão"):"",
        ].join("")),
        el("i",{"class":"ti ti-chevron-"+(fusOpen?"up":"down"),"style":"font-size:13px;color:"+ter+";","aria-hidden":"true"},"")
      ].join("")),
      // Corpo colapsável
      el("div",{id:fusId,style:"display:"+(fusOpen?"block":"none")+";"},[
        // Seção 1 — Realizadas
        fusioesRealizadas.length>0?el("div",{style:"padding:0 16px 14px;"},[
          el("div",{style:"font-size:10px;font-weight:800;color:"+alertGreen+";letter-spacing:1px;margin-bottom:8px;padding-top:4px;"},"✅ FUSÕES REALIZADAS AUTOMATICAMENTE (score ≥ 0.80)"),
          el("table",{style:"width:100%;border-collapse:collapse;font-size:11px;"},[
            el("thead",{},el("tr",{style:"border-bottom:0.5px solid "+brd+";"},
              ["Nome Canônico","Nome Fundido","Fontes","Score"].map(function(hh){
                return el("th",{style:"padding:6px 8px;text-align:left;color:"+ter+";font-weight:600;"},hh);
              }).join(""))),
            el("tbody",{},fusioesRealizadas.map(function(f,i){
              return el("tr",{style:"border-bottom:0.5px solid "+faint+";"+(i%2===1?"background:"+tblRow:"")},[
                el("td",{style:"padding:6px 8px;font-weight:600;color:"+txt+";"},f.nomeCanônico),
                el("td",{style:"padding:6px 8px;color:"+mut+";"},f.nomeFundido),
                el("td",{style:"padding:6px 8px;"},
                  el("span",{style:"font-size:9px;background:"+alertGreen+"22;color:"+alertGreen+";padding:2px 6px;border-radius:4px;font-weight:700;"},f.fonteA+" ↔ "+f.fonteB)),
                el("td",{style:"padding:6px 8px;font-weight:700;color:"+alertGreen+";"},Math.round(f.score*100)+"%")
              ].join(""));
            }).join(""))
          ].join(""))
        ].join("")):"",
        // Seção 2 — Possíveis
        fusoesPossiveis.length>0?el("div",{style:"padding:0 16px 14px;border-top:"+(fusioesRealizadas.length>0?"0.5px solid "+brd:"none")+";padding-top:"+(fusioesRealizadas.length>0?"12px":"0")+";"},[
          el("div",{style:"font-size:10px;font-weight:800;color:"+alertOrange+";letter-spacing:1px;margin-bottom:8px;padding-top:4px;"},"⚠️ POSSÍVEIS FUSÕES — REVISÃO MANUAL (score 0.65–0.79)"),
          el("p",{style:"font-size:10px;color:"+mut+";margin-bottom:8px;font-style:italic;"},"O sistema não fundiu automaticamente. Verifique se são a mesma pessoa."),
          el("table",{style:"width:100%;border-collapse:collapse;font-size:11px;"},[
            el("thead",{},el("tr",{style:"border-bottom:0.5px solid "+brd+";"},
              ["Nome A","Fonte A","Nome B","Fonte B","Score"].map(function(hh){
                return el("th",{style:"padding:6px 8px;text-align:left;color:"+ter+";font-weight:600;"},hh);
              }).join(""))),
            el("tbody",{},fusoesPossiveis.map(function(f,i){
              return el("tr",{style:"border-bottom:0.5px solid "+faint+";"+(i%2===1?"background:"+tblRow:"")},[
                el("td",{style:"padding:6px 8px;font-weight:600;color:"+txt+";"},f.nomeA),
                el("td",{style:"padding:6px 8px;"},el("span",{style:"font-size:9px;background:"+alertOrange+"22;color:"+alertOrange+";padding:2px 6px;border-radius:4px;font-weight:700;"},f.fonteA)),
                el("td",{style:"padding:6px 8px;color:"+txt+";"},f.nomeB),
                el("td",{style:"padding:6px 8px;"},el("span",{style:"font-size:9px;background:"+alertOrange+"22;color:"+alertOrange+";padding:2px 6px;border-radius:4px;font-weight:700;"},f.fonteB)),
                el("td",{style:"padding:6px 8px;font-weight:700;color:"+alertOrange+";"},Math.round(f.score*100)+"%")
              ].join(""));
            }).join(""))
          ].join(""))
        ].join("")):"",
      ].join(""))
    ].join(""));
  }

  // Filtros + busca
  var filterBtns=[
    {k:"todos",l:"Todos ("+total+")"},
    {k:"candidato",l:"Candidatos ("+candidatos.length+")"},
    {k:"multiplas",l:"Múltiplas fontes ("+multiplas.length+")"},
    {k:"so_direto",l:"Só direto ("+soDireto.length+")"},
    {k:"fds_apenas",l:"Só FDS ("+soFdsApenas.length+")"}
  ];
  h+=el("div",{style:"background:"+card+";border-radius:10px;border:0.5px solid "+brd+";overflow:hidden;"},[
    el("div",{style:"padding:12px 16px;border-bottom:0.5px solid "+brd+";display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;"},[
      el("div",{style:"display:flex;gap:5px;flex-wrap:wrap;"},
        filterBtns.map(function(f){
          var act=ubFilter===f.k;
          return el("button",{"data-action":"ub-filter","data-val":f.k,style:"padding:5px 10px;border-radius:6px;border:none;background:"+(act?G:faint)+";color:"+(act?"#0a0900":mut)+";font-size:10px;font-weight:"+(act?800:500)+";cursor:pointer;"},f.l);
        }).join("")),
      el("input",{id:"ub-search",type:"text",placeholder:"Buscar aluno...",value:ubSearch,
        oninput:"clearTimeout(window._ubSearchTimer);window._ubSearchTimer=setTimeout(function(){ubSearch=document.getElementById('ub-search').value;ubPage=1;renderUBTabela();},200);",
        style:"background:"+faint+";border:0.5px solid "+brd+";border-radius:6px;padding:5px 10px;color:"+txt+";font-size:11px;width:180px;"},"")
    ].join("")),
    // Tabela
    el("div",{style:"padding:10px 16px;border-bottom:0.5px solid "+brd+";display:flex;flex-wrap:wrap;align-items:center;gap:7px 16px;"},
      [
        {lb:"Perfil",arr:ubPerfilF,act:"ub-perfil",opts:[["fiel","Fiel"],["regular","Regular"],["esporadico","Esporádico"]]},
        {lb:"Status",arr:ubStatusF,act:"ub-status",opts:[["ativo","Ativo"],["em_risco","Em risco"],["inativo","Inativo"]]},
        {lb:"Tendência",arr:ubTendF,act:"ub-tend",opts:[["crescente","↑ Crescente"],["estavel","→ Estável"],["decrescente","↓ Decrescente"],["oscilante","~ Oscilante"]]},
        {lb:"Fonte",arr:ubFonteF,act:"ub-fonte",opts:[["gp","Gympass"],["tp","Totalpass"],["nf","NextFit"]]}
      ].map(function(dim){
        return el("div",{style:"display:flex;align-items:center;gap:5px;"},
          [el("span",{style:"font-size:9px;color:"+ter+";text-transform:uppercase;letter-spacing:0.5px;flex-shrink:0;"},dim.lb)].concat(
            dim.opts.map(function(o){
              var on=dim.arr.indexOf(o[0])>=0;
              return el("button",{"data-action":dim.act,"data-val":o[0],style:"padding:4px 9px;border-radius:6px;border:0.5px solid "+(on?G:brd)+";background:"+(on?G:"transparent")+";color:"+(on?"#0a0900":mut)+";font-size:10px;font-weight:"+(on?800:500)+";cursor:pointer;white-space:nowrap;"},o[1]);
            })
          ).join(""));
      }).join("")
      + el("div",{style:"display:flex;align-items:center;gap:5px;"},[
          el("button",{"data-action":"ub-fds",style:"padding:4px 9px;border-radius:6px;border:0.5px solid "+(ubFdsF?"#8B5CF6":brd)+";background:"+(ubFdsF?"#8B5CF6":"transparent")+";color:"+(ubFdsF?"#fff":mut)+";font-size:10px;font-weight:"+(ubFdsF?800:500)+";cursor:pointer;white-space:nowrap;"},"◐ Só fim de semana"),
          el("button",{"data-action":"ub-clearf",style:"padding:4px 9px;border-radius:6px;border:0.5px solid "+brd+";background:"+faint+";color:"+mut+";font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;"},"✕ Limpar filtros")
        ].join(""))
    ),
    el("div",{style:"padding:7px 16px;border-bottom:0.5px solid "+brd+";display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:9px;"},[
      el("span",{style:"font-weight:700;color:"+ter+";letter-spacing:0.5px;"},"REGRA DE STATUS (dias desde a última visita):"),
      el("span",{style:"color:"+alertGreen+";font-weight:700;"},"● Ativo ≤ 35 dias"),
      el("span",{style:"color:"+alertOrange+";font-weight:700;"},"● Em risco 36–65 dias"),
      el("span",{style:"color:"+alertRed+";font-weight:700;"},"● Inativo > 65 dias"),
      el("span",{style:"color:"+mut+";font-style:italic;"},"· recência das duas fontes (Gympass + Totalpass)")
    ].join("")),
    el("div",{style:"overflow-x:auto;"},
      el("table",{style:"width:100%;border-collapse:collapse;font-size:11px;min-width:700px;"},[
        el("thead",{},el("tr",{style:"background:"+tblRow+";border-bottom:0.5px solid "+brd+";"},
          ["Aluno","NextFit","Gympass","Totalpass","Perfil","Tendência","Status / última visita","Situação","Confiança"].map(function(hh,i){
            return el("th",{style:"padding:9px 12px;text-align:"+(i===0?"left":"center")+";color:"+ter+";font-weight:600;white-space:nowrap;"},hh);
          }).join(""))),
        el("tbody",{id:"ub-tbody"},"")
      ].join(""))),
    // Paginação (preenchida por renderUBTabela)
    el("div",{style:"padding:10px 16px;border-top:0.5px solid "+brd+";display:flex;align-items:center;justify-content:space-between;"},[
      el("span",{id:"ub-count",style:"font-size:11px;color:"+mut+";"},""),
      el("div",{id:"ub-paging",style:"display:flex;gap:5px;flex-wrap:wrap;"},"")
    ].join(""))
  ].join(""));

  c.innerHTML=h;
  renderUBTabela();
}

// ═══════════════════════════════════════════════════════════════════════════
// INICIALIZAÇÃO
// ═══════════════════════════════════════════════════════════════════════════
document.body.style.background=bg;
rerender();
</script>
