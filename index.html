var _st=null;try{_st=localStorage.getItem("rbc_theme");}catch(e){}
var isDark=_st?"dark"===_st:false; // claro como padrão
var bg,card,brd,txt,mut,ter,faint,tblRow;

function applyTheme(){
  if(isDark){
    bg="#0f0f13";card="#1a1a22";brd="#2a2a38";txt="#e8e6f0";
    mut="#8884a0";ter="#4a4860";faint="#22222e";tblRow="#16161f";
  } else {
    bg="#f0f2f7";card="#ffffff";brd="#e2e5ee";txt="#1a1828";
    mut="#6b6880";ter="#a8a8c0";faint="#f7f8fc";tblRow="#f4f5fa";
  }
}
applyTheme();

function toggleTheme(){
  isDark=!isDark;applyTheme();
  document.body.style.background=bg;
  try{localStorage.setItem("rbc_theme",isDark?"dark":"light");}catch(e){}
  rerender();
}

function isDiaDescanso(dt){
  // Retorna true se o dia é sábado, domingo ou feriado SP
  if(!dt) return false;
  var dow=dt.getDay(); // 0=dom, 6=sab
  if(dow===0||dow===6) return true;
  var key=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  return !!FERIADOS_SP[key];
}

function classifyGPAluno(checkins){
  // checkins: array de objetos Date (um por visita)
  if(!checkins||!checkins.length) return {categoria:"esporadico",tendencia:"",status:"inativo",diasSemVir:999,totalVisitas:0,diasUteis:0};

  // 1. Separar dias úteis vs dias de descanso
  var diasUteis=checkins.filter(function(dt){return !isDiaDescanso(dt);});
  var totalVisitas=checkins.length;

  // 2. Categoria
  var categoria;
  if(diasUteis.length===0){
    categoria="fds"; // só final de semana / feriados
  } else if(totalVisitas>=11){
    categoria="fiel";
  } else if(totalVisitas>=4){
    categoria="regular";
  } else {
    categoria="esporadico";
  }

  // 3. Tendência — agrupa visitas por mês e compara metade inicial vs metade final
  var porMes={};
  checkins.forEach(function(dt){
    var key=dt.getFullYear()*100+(dt.getMonth()+1);
    if(!porMes[key]) porMes[key]=0;
    porMes[key]++;
  });
  var meses=Object.keys(porMes).sort();
  var tendencia="estavel";
  if(meses.length>=2){
    var metade=Math.floor(meses.length/2);
    var primeira=meses.slice(0,metade);
    var segunda=meses.slice(meses.length-metade);
    var mediaP=primeira.reduce(function(s,k){return s+porMes[k];},0)/primeira.length;
    var mediaS=segunda.reduce(function(s,k){return s+porMes[k];},0)/segunda.length;
    var diff=mediaS-mediaP;
    if(meses.length>=3){
      // Verificar oscilação — desvio padrão alto = oscilante
      var vals=meses.map(function(k){return porMes[k];});
      var media=vals.reduce(function(a,b){return a+b;},0)/vals.length;
      var variancia=vals.reduce(function(s,v){return s+Math.pow(v-media,2);},0)/vals.length;
      var dp=Math.sqrt(variancia);
      if(dp>media*0.5&&Math.abs(diff)<2) tendencia="oscilante";
      else if(diff>=2) tendencia="crescente";
      else if(diff<=-2) tendencia="decrescente";
      else tendencia="estavel";
    } else {
      if(diff>=2) tendencia="crescente";
      else if(diff<=-2) tendencia="decrescente";
      else tendencia="estavel";
    }
  }

  // 4. Status — baseado na data do último check-in
  var hoje=new Date();
  var ultimoCheckin=checkins.reduce(function(max,dt){return dt>max?dt:max;},checkins[0]);
  var diasSemVir=Math.floor((hoje-ultimoCheckin)/(1000*60*60*24));
  var status;
  if(diasSemVir<=35)       status="ativo";
  else if(diasSemVir<=65)  status="em_risco";
  else                      status="inativo";

  return {categoria:categoria,tendencia:tendencia,totalVisitas:totalVisitas,diasUteis:diasUteis.length,status:status,diasSemVir:diasSemVir,ultimoCheckin:ultimoCheckin};
}

function nomeMes(m){return["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"][m];}

function detectPeriodo(nome,rows){
  // 1. Tentar via dados
  if(rows&&rows.length){
    var cols=Object.keys(rows[0]);
    var dateCol=null;
    cols.forEach(function(c){
      var v=rows[0][c];
      if(v instanceof Date) dateCol=c;
    });
    if(dateCol){
      var datas=rows.slice(0,200).map(function(r){
        var v=r[dateCol];
        if(v instanceof Date) return v;
        if(typeof v==="string"){
          var d=new Date(v.replace(/(\d{2})\/(\d{2})\/(\d{4})/,"$3-$2-$1"));
          return isNaN(d)?null:d;
        }
        return null;
      }).filter(Boolean);
      if(datas.length){
        var min=new Date(Math.min.apply(null,datas));
        var max=new Date(Math.max.apply(null,datas));
        var mMin=min.getMonth()+1,yMin=min.getFullYear();
        var mMax=max.getMonth()+1,yMax=max.getFullYear();
        var yMin2=String(yMin).slice(2),yMax2=String(yMax).slice(2);
        if(mMin===mMax&&yMin===yMax) return {label:nomeMes(mMin)+"/"+yMin2,confianca:"alta"};
        return {label:nomeMes(mMin)+"/"+yMin2+" - "+nomeMes(mMax)+"/"+yMax2,confianca:"alta"};
      }
    }
  }
  // 2. Tentar via nome
  var s=nome.toLowerCase().replace(/[_\-\.]/g," ");
  var mes=null,ano=null;
  Object.keys(MESES_PT).forEach(function(k){if(s.indexOf(k)>=0) mes=MESES_PT[k];});
  var m=s.match(/20(\d{2})/);
  if(m) ano=parseInt("20"+m[1]);
  if(mes&&ano) return {label:nomeMes(mes)+"/"+String(ano).slice(2),confianca:"media"};
  if(ano) return {label:String(ano).slice(2),confianca:"media"};
  return {label:"Período não detectado",confianca:"baixa"};
}

// CONSTRUTOR DE HTML — função central, zero template literals
// Regra: NUNCA colocar aspas dentro de onclick. Usar data-* + event delegation.
// ═══════════════════════════════════════════════════════════════════════════
function el(tag,attrs,children){
  var h="<"+tag;
  if(attrs){
    Object.keys(attrs).forEach(function(k){
      if(attrs[k]!==null&&attrs[k]!==undefined&&attrs[k]!==false){
        h+=" "+k+'="'+String(attrs[k]).replace(/"/g,"&quot;")+'"';
      }
    });
  }
  h+=">";
  if(children){
    if(Array.isArray(children)) h+=children.join("");
    else h+=children;
  }
  h+="</"+tag+">";
  return h;
}

// ═══════════════════════════════════════════════════════════════════════════
// EVENT DELEGATION — todos os clicks passam por aqui
// Nenhum onclick inline com strings — só data-* attributes
// ═══════════════════════════════════════════════════════════════════════════
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-action]");
  if(!t) return;
  var action=t.dataset.action;
  var val=t.dataset.val||"";
  var val2=t.dataset.val2||"";

  if(action==="nav"){navTo(val);}
  else if(action==="group"){toggleGroup(val);}
  else if(action==="logout"){doLogout();}
  else if(action==="theme"){toggleTheme();}
  else if(action==="login"){doLogin();}
  else if(action==="gp-filt-perf"){
    window._gpFiltPerf=window._gpFiltPerf===val?null:val;
    rp();
  }
  else if(action==="gp-filt-tend"){
    window._gpFiltTend=window._gpFiltTend===val?null:val;
    rp();
  }
  else if(action==="gp-filt-status"){
    window._gpFiltStatus=window._gpFiltStatus===val?null:val;
    rp();
  }
  else if(action==="gp-filt-clear"){
    window._gpFiltPerf=null; window._gpFiltTend=null; window._gpFiltStatus=null;
    rp();
  }
  else if(action==="inad-filter"){inadF=val;rp();}
  else if(action==="ub-filter"){ubFilter=val;ubPage=1;rp();}
  else if(action==="ub-perfil"){ubToggle(ubPerfilF,val);ubPage=1;rp();}
  else if(action==="ub-status"){ubToggle(ubStatusF,val);ubPage=1;rp();}
  else if(action==="ub-tend"){ubToggle(ubTendF,val);ubPage=1;rp();}
  else if(action==="ub-fonte"){ubToggle(ubFonteF,val);ubPage=1;rp();}
  else if(action==="ub-fds"){ubFdsF=!ubFdsF;ubPage=1;rp();}
  else if(action==="ub-clearf"){ubFilter="todos";ubPerfilF=[];ubStatusF=[];ubTendF=[];ubFonteF=[];ubFdsF=false;ubSearch="";ubPage=1;rp();}
  else if(action==="ub-open"){openAlunoModal(parseInt(val));}
  else if(action==="ub-close"){closeAlunoModal();}
  else if(action==="ub-page"){ubPage=parseInt(val);renderUBTabela();}
  else if(action==="fus-toggle"){
    window._fusOpen=!window._fusOpen;
    var body=document.getElementById("fus-card-body");
    if(body) body.style.display=window._fusOpen?"block":"none";
    rp();
  }
  else if(action==="grid-fonte"){gridFonte=val;gridArquivo="todos";gridPage=1;gridSearch="";gridSort={col:null,asc:true};rp();}
  else if(action==="grid-arquivo"){gridArquivo=val;gridPage=1;gridSearch="";rp();}
  else if(action==="grid-pagesize"){gridPageSize=parseInt(val);gridPage=1;rp();}
  else if(action==="grid-page"){gridPage=parseInt(val);rp();}
  else if(action==="grid-sort"){sortByCol(parseInt(val));e.stopPropagation();}
  else if(action==="grid-clear-search"){gridSearch="";gridPage=1;rp();}
  else if(action==="grid-export"){exportCSV();}
  else if(action==="grid-remove"){removerArquivo(parseInt(val),e);}
  else if(action==="gp-filter"){gpFilter={tipo:t.dataset.tipo,valor:t.dataset.val,gridPage:1};rp();}
  else if(action==="gp-clear"){gpFilter={tipo:null,valor:null,gridPage:1};rp();}
  else if(action==="gp-page"){gpFilter.gridPage=parseInt(val);var s3=computeGPStats();if(s3)renderGPGrid(s3);}
  else if(action==="tp-filter"){tpFilter={tipo:t.dataset.tipo,valor:t.dataset.val,gridPage:1};rp();}
  else if(action==="tp-clear"){tpFilter={tipo:null,valor:null,gridPage:1};rp();}
  else if(action==="tp-ret-filter"){tpRetFilter=val;var retTable=document.getElementById("tp-ret-table");if(retTable){var s6=computeTPStats();if(s6)retTable.innerHTML=renderTPRetencaoTabela(s6);}}
  else if(action==="tp-churn-sel"){tpChurnTransicao=parseInt(val);rp();}
  else if(action==="tp-page"){tpFilter.gridPage=parseInt(val);var s4=computeTPStats();if(s4)renderTPGrid(s4);}
  else if(action==="nf-filter"){nfFilter={tipo:t.dataset.tipo,valor:t.dataset.val,gridPage:1};rp();}
  else if(action==="nf-clear"){nfFilter={tipo:null,valor:null,gridPage:1};rp();}
  else if(action==="consol-view"){consolView=t.dataset.val;rp();}
  else if(action==="consol-expand"){consolExpand=consolExpand===t.dataset.val?null:t.dataset.val;rp();}
  else if(action==="nf-churn-exp"){nfChurnExp=nfChurnExp===t.dataset.val?null:t.dataset.val;rp();}
  else if(action==="nf-page"){nfFilter.gridPage=parseInt(val);var s5=computeNFStats();if(s5)renderNFGrid(s5);}
  // gp-page handled above
  else if(action==="upload-confirm"){confirmarImport();}
  else if(action==="upload-view"){navTo("visualizar");}
  else if(action==="file-pick"){document.getElementById("fi").click();}
});

    (stats.mesList||[]).forEach(function(m){
      if(!mesMapa[m.label]) mesMapa[m.label]={m:m.label,nf:0,gp:0,tp:0,dt:m.dt};
      mesMapa[m.label][fonte]+=m[valField]||0;

  if(tpStats)(tpStats.periodoList||[]).forEach(function(p){

    mesMapa[p.label].tp+=p.receita||0;

  var meses=Object.values(mesMapa).sort(function(a,b){
    var ORDEM={Jan:1,Fev:2,Mar:3,Abr:4,Mai:5,Jun:6,Jul:7,Ago:8,Set:9,Out:10,Nov:11,Dez:12};
    var ma=a.m.match(/(\w+)\/(\d+)/); var mb=b.m.match(/(\w+)\/(\d+)/);
    if(!ma||!mb) return 0;
    if(ma[2]!==mb[2]) return parseInt(ma[2])-parseInt(mb[2]);
    return (ORDEM[ma[1]]||0)-(ORDEM[mb[1]]||0);

  computeUnifiedBase();
  function _cMI(d){var mm=String(d||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(!mm)return null;return (+mm[3])*12+(+mm[2]-1);}

  function _labIdxK(label){var mm=String(label).match(/(\w+)\/(\d+)/);if(!mm)return null;var mo=_ORDM[mm[1]];if(mo==null)return null;var yy=2000+parseInt(mm[2],10);return {idx:yy*12+mo,k:(yy===2026?mo:-1)};}

// ─── GYMPASS ──────────────────────────────────────────────────────────────
// ─── GYMPASS — lê do dataStore ────────────────────────────────────────────
function computeGPStats(){
  var allRows=[];
  (dataStore.gympass||[]).forEach(function(a){a.rows.forEach(function(r){allRows.push(r);});});
  if(!allRows.length) return null;
  var cols=Object.keys(allRows[0]).filter(function(c){return c!=="_id"&&c!=="_arquivo"&&c!=="_periodo";});
  // Detectar colunas
  var dateCol=null,valCol=null,nameCol=null,horaCol=null;
  cols.forEach(function(c){
    var cl=c.toLowerCase();
    if(!dateCol&&(cl.indexOf("data")>=0||cl.indexOf("date")>=0||cl.indexOf("check")>=0)){
      var v=allRows[0][c]; if(v instanceof Date||(typeof v==="string"&&v.match(/\d{2}[\/\-]\d{2}/))) dateCol=c;
    }
    if(!valCol&&(cl.indexOf("valor")>=0||cl.indexOf("pag")>=0||cl.indexOf("liquid")>=0||cl.indexOf("repasse")>=0)){
      if(typeof allRows[0][c]==="number") valCol=c;
    }
    if(!nameCol&&(cl.indexOf("nome")>=0||cl.indexOf("visit")>=0||cl.indexOf("usuario")>=0||cl.indexOf("aluno")>=0)){
      if(typeof allRows[0][c]==="string") nameCol=c;
    }
    if(!horaCol&&(cl.indexOf("hora")>=0||cl.indexOf("time")>=0)){horaCol=c;}
  });
  // Fallbacks
  if(!dateCol) cols.forEach(function(c){if(!dateCol&&allRows[0][c] instanceof Date) dateCol=c;});
  // Também verificar strings numéricas (coluna pode ter sido normalizada)
  if(!valCol) cols.forEach(function(c){if(!valCol&&typeof allRows[0][c]==="number"&&allRows[0][c]>1) valCol=c;});
  if(!valCol) cols.forEach(function(c){
    if(!valCol){
      var cl=c.toLowerCase();
      if(cl.indexOf("valor")>=0||cl.indexOf("liquid")>=0||cl.indexOf("repasse")>=0||cl.indexOf("pag")>=0){
        var v=allRows[0][c];
        if(typeof v==="string"&&!isNaN(parseFloat(v.replace(/[R$\s,]/g,"")))) valCol=c;
      }
    }
  });
  if(!nameCol) cols.forEach(function(c){if(!nameCol&&typeof allRows[0][c]==="string"&&allRows[0][c].indexOf(" ")>0) nameCol=c;});

  function getDate(r){
    var v=dateCol?r[dateCol]:null;
    if(v instanceof Date){
      return new Date(v.getUTCFullYear(),v.getUTCMonth(),v.getUTCDate());
    }
    if(typeof v==="string"){
      var dm=v.match(/(\d{2})\/(\d{2})\/(\d{4})/);
      if(dm) return new Date(parseInt(dm[3]),parseInt(dm[2])-1,parseInt(dm[1]));
      var dm2=v.match(/(\d{4})-(\d{2})-(\d{2})/);
      if(dm2) return new Date(parseInt(dm2[1]),parseInt(dm2[2])-1,parseInt(dm2[3]));
    }
    return null;
  }
  function getMesLabel(dt){
    if(!dt) return "";
    return nomeMes(dt.getMonth()+1)+"/"+String(dt.getFullYear()).slice(2);
  }
  function getHora(r){
    if(horaCol&&r[horaCol]) return String(r[horaCol]).slice(0,2)+"h";
    var dt=getDate(r);
    if(dt){var hh=dt.getHours();return(hh<10?"0"+hh:hh)+"h";}
    return "";
  }

  var totalReceita=0,alunosSet={},mesMapa={},horaMapa={},nomeMapa={};
  allRows.forEach(function(r){
    if(valCol&&typeof r[valCol]==="number") totalReceita+=r[valCol];
    if(nameCol&&r[nameCol]) alunosSet[r[nameCol]]=true;
    var dt=getDate(r);
    var mes=getMesLabel(dt);
    if(mes){
      if(!mesMapa[mes]) mesMapa[mes]={label:mes,ci:0,receita:0,dt:dt};
      mesMapa[mes].ci++;
      if(valCol&&typeof r[valCol]==="number") mesMapa[mes].receita+=r[valCol];
    }
    var hora=getHora(r);
    if(hora){
      if(!horaMapa[hora]) horaMapa[hora]={h:hora,n:0};
      horaMapa[hora].n++;
    }
    if(nameCol&&r[nameCol]){
      var n=r[nameCol];
      if(!nomeMapa[n]) nomeMapa[n]={n:n,ci:0};
      nomeMapa[n].ci++;
    }
  });

  var mesesOrder=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  var mesList=Object.values(mesMapa).sort(function(a,b){
    var ya=parseInt(a.label.slice(4)),yb=parseInt(b.label.slice(4));
    var ma=mesesOrder.indexOf(a.label.slice(0,3)),mb=mesesOrder.indexOf(b.label.slice(0,3));
    return ya!==yb?ya-yb:ma-mb;
  });
  var horaList=Object.values(horaMapa).sort(function(a,b){return parseInt(a.h)-parseInt(b.h);});
  var topList=Object.values(nomeMapa).sort(function(a,b){return b.ci-a.ci;});
  var ticketMedio=allRows.length>0?totalReceita/allRows.length:0;

  // Churn: alunos do 1o mês que não aparecem no último
  var churn=0;
  if(mesList.length>=2&&nameCol){
    var firstMes=mesList[0].label,lastMes=mesList[mesList.length-1].label;
    var af={},al={};
    allRows.forEach(function(r){
      var dt=getDate(r);var mes=getMesLabel(dt);
      if(r[nameCol]){if(mes===firstMes)af[r[nameCol]]=true;if(mes===lastMes)al[r[nameCol]]=true;}
    });
    Object.keys(af).forEach(function(n){if(!al[n])churn++;});
  }

  // Retenção por frequência
  var alunoMeses={};
  if(nameCol){
    allRows.forEach(function(r){
      var n=r[nameCol];if(!n)return;
      var dt=getDate(r);var mes=getMesLabel(dt);
      if(!alunoMeses[n])alunoMeses[n]={};
      if(mes)alunoMeses[n][mes]=true;
    });
  }
  var totalMeses=mesList.length||1;
  var fieis=0,regulares=0,esporadicos=0,soFds=0;
  var ativos=0,emRisco=0,inativos=0;
  var alunoClassif={}; // nome → {categoria, tendencia, status}
  if(nameCol){
    var alunoCheckins={};
    allRows.forEach(function(r){
      var n=r[nameCol]; if(!n) return;
      var dt=getDate(r); if(!dt) return;
      if(!alunoCheckins[n]) alunoCheckins[n]=[];
      alunoCheckins[n].push(dt);
    });
    Object.keys(alunoCheckins).forEach(function(n){
      var res=classifyGPAluno(alunoCheckins[n]);
      alunoClassif[n]=res;
      if(res.categoria==="fiel") fieis++;
      else if(res.categoria==="regular") regulares++;
      else if(res.categoria==="fds") soFds++;
      else esporadicos++;
      if(res.status==="ativo") ativos++;
      else if(res.status==="em_risco") emRisco++;
      else inativos++;
    });
  }

  return {
    totalCheckins:allRows.length,totalReceita:totalReceita,
    totalAlunos:Object.keys(alunosSet).length,ticketMedio:ticketMedio,churn:churn,
    fieis:fieis,regulares:regulares,esporadicos:esporadicos,soFds:soFds,
    ativos:ativos,emRisco:emRisco,inativos:inativos,
    alunoClassif:alunoClassif,
    mesList:mesList,horaList:horaList,
    topList:topList.filter(function(a){
      var cl=alunoClassif[a.n];
      return !cl||cl.status!=="inativo";
    }).slice(0,10),
    allRows:allRows,
    getDate:getDate,getMesLabel:getMesLabel,getHora:getHora,
    cols:{date:dateCol,val:valCol,name:nameCol,hora:horaCol}
  };
}

// ─── TOTALPASS ────────────────────────────────────────────────────────────
// ─── TOTALPASS — lê do dataStore ────────────────────────────────────────────
// Totalpass tem dois formatos na mesma origem: MENSAL (receita) e VALIDAÇÕES (check-in diário).
// As funções de receita/período devem usar SÓ os arquivos mensais.
function tpEhValidacoes(a){
  var rows=(a&&a.rows)||[]; if(!rows.length) return false;
  var cols=Object.keys(rows[0]);
  var hasVal=cols.some(function(c){
    var cl=c.toLowerCase();
    if(cl.indexOf("valor")>=0||cl.indexOf("liquid")>=0||cl.indexOf("repasse")>=0||cl.indexOf("receita")>=0){
      var v=rows[0][c];
      if(typeof v==="number"&&v>0) return true;
      if(typeof v==="string"&&!isNaN(parseFloat(String(v).replace(/[R$\s]/g,"").replace(",",".")))) return true;
    }
    return false;
  });
  if(hasVal) return false;
  var hasDate=cols.some(function(c){ var v=rows[0][c]; return (v instanceof Date)||(typeof v==="string"&&/\d{2}:\d{2}/.test(v)&&/(\d{4}-\d{2}-\d{2}|\d{2}\/\d{2}\/\d{4})/.test(v)); });
  var hasContrato=cols.some(function(c){ return c.toLowerCase().indexOf("contrato")>=0; });
  return hasDate||hasContrato;
}
function tpFilesRec(){ return (dataStore.totalpass||[]).filter(function(a){ return !tpEhValidacoes(a); }); }

function computeTPStats(){
  var tpFiles=tpFilesRec();
  var allRows=[];
  tpFiles.forEach(function(a){
    a.rows.forEach(function(r){
      allRows.push(Object.assign({},r,{_arquivo:a.meta.nome,_periodo:a.meta.periodo}));
    });
  });
  if(!allRows.length) return null;
  var cols=Object.keys(allRows[0]).filter(function(c){
    return c!=="_id"&&c!=="_arquivo"&&c!=="_periodo"&&c!=="_ai";
  });

  // Detectar coluna de valor líquido
  // Primeiro tentar via colMeta (mais confiável — usa metadados da normalização)
  var allColMeta={};
  tpFiles.forEach(function(a){Object.assign(allColMeta,a.meta.colMeta||{});});
  var valCol=null;
  // Prioridade 1: coluna financeira pelo nome
  cols.forEach(function(c){
    if(!valCol){
      var cl=c.toLowerCase();
      if(cl.indexOf("valor")>=0||cl.indexOf("liquid")>=0||cl.indexOf("repasse")>=0){
        // Aceitar tanto número quanto string (pode ter sido normalizado)
        var sample=allRows.slice(0,10).map(function(r){return r[c];});
        var hasNumeric=sample.some(function(v){return typeof v==="number"&&v>0;});
        var hasNumericStr=sample.some(function(v){return typeof v==="string"&&!isNaN(parseFloat(v.replace(",",".")))&&parseFloat(v.replace(",","."))>0;});
        if(hasNumeric||hasNumericStr) valCol=c;
      }
    }
  });
  // Prioridade 2: qualquer coluna com "total" no nome e valores numéricos/financeiros
  if(!valCol) cols.forEach(function(c){
    if(!valCol){
      var cl=c.toLowerCase();
      if(cl.indexOf("total")>=0){
        var sample=allRows.slice(0,10).map(function(r){return r[c];});
        var hasNumeric=sample.some(function(v){return typeof v==="number"&&v>0;});
        if(hasNumeric) valCol=c;
      }
    }
  });
  // Prioridade 3: primeira coluna com números > 10
  if(!valCol) cols.forEach(function(c){
    if(!valCol){
      var sample=allRows.slice(0,10).map(function(r){return r[c];});
      var hasNumeric=sample.some(function(v){return typeof v==="number"&&v>10;});
      if(hasNumeric) valCol=c;
    }
  });
  // Prioridade 4: coluna numérica em string (foi normalizada incorretamente)
  if(!valCol) cols.forEach(function(c){
    if(!valCol){
      var cl=c.toLowerCase();
      if(cl.indexOf("valor")>=0||cl.indexOf("liquid")>=0||cl.indexOf("total")>=0){
        var sample=allRows.slice(0,10).map(function(r){return r[c];});
        var hasStr=sample.some(function(v){return typeof v==="string"&&v.length>0&&!isNaN(parseFloat(v.replace(/[R$\s,]/g,"")));});
        if(hasStr) valCol=c;
      }
    }
  });

  // Detectar coluna de nome
  var nameCol=null;
  cols.forEach(function(c){
    if(!nameCol){
      var cl=c.toLowerCase();
      if(cl.indexOf("nome")>=0||cl.indexOf("name")>=0||cl.indexOf("client")>=0||cl.indexOf("aluno")>=0){
        if(typeof allRows[0][c]==="string") nameCol=c;
      }
    }
  });
  if(!nameCol) cols.forEach(function(c){if(!nameCol&&typeof allRows[0][c]==="string"&&(allRows[0][c]||"").indexOf(" ")>0) nameCol=c;});

  // Agrupar por arquivo (período)
  var periodoMapa={};
  tpFiles.forEach(function(a){
    var key=a.meta.periodo;
    if(!periodoMapa[key]) periodoMapa[key]={label:key,alunos:0,receita:0,rows:[]};
    periodoMapa[key].alunos+=a.rows.length;
    a.rows.forEach(function(r){
      if(valCol){
          var rv=r[valCol];
          if(typeof rv==="number") periodoMapa[key].receita+=rv;
          else if(typeof rv==="string"){var pv=parseFloat(rv.replace(/[R$\s]/g,"").replace(",","."));if(!isNaN(pv)) periodoMapa[key].receita+=pv;}
        }
      periodoMapa[key].rows.push(r);
    });
  });

  // Ordenar períodos cronologicamente
  var mesesOrder=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  // Normalizar labels para "Mmm/YY" (2 dígitos no ano)
  function normLabel(label){
    if(!label) return label;
    var parts=label.split("/");
    if(parts.length===2&&parts[1].length===4) return parts[0]+"/"+parts[1].slice(2);
    return label;
  }
  Object.keys(periodoMapa).forEach(function(key){
    var norm=normLabel(key);
    if(norm!==key){
      periodoMapa[norm]=periodoMapa[key];
      periodoMapa[norm].label=norm;
      delete periodoMapa[key];
    }
  });
  var periodoList=Object.values(periodoMapa).sort(function(a,b){
    var ya=parseInt(a.label.slice(-2)),yb=parseInt(b.label.slice(-2));
    var ma=mesesOrder.indexOf(a.label.slice(0,3)),mb=mesesOrder.indexOf(b.label.slice(0,3));
    return ya!==yb?ya-yb:ma-mb;
  });

  // Totais
  var totalReceita=0,totalAlunos=0;
  periodoList.forEach(function(p){totalReceita+=p.receita;});
  var alunosSet={};
  if(nameCol) allRows.forEach(function(r){if(r[nameCol]) alunosSet[r[nameCol]]=true;});
  totalAlunos=Object.keys(alunosSet).length;

  var ticketMedio=allRows.length>0?totalReceita/allRows.length:0;  // por registro/mês

  // Top alunos por receita
  var alunoReceita={};
  if(nameCol&&valCol){
    allRows.forEach(function(r){
      var n=r[nameCol];if(!n)return;
      if(!alunoReceita[n]) alunoReceita[n]={n:n,receita:0,meses:{}};
      var rv2=r[valCol];
          if(typeof rv2==="number") alunoReceita[n].receita+=rv2;
          else if(typeof rv2==="string"){var pv2=parseFloat(rv2.replace(/[R$\s]/g,"").replace(",","."));if(!isNaN(pv2)) alunoReceita[n].receita+=pv2;}
      if(r._periodo) alunoReceita[n].meses[r._periodo]=true;
    });
  }
  var topAlunos=Object.values(alunoReceita).sort(function(a,b){return b.receita-a.receita;}).slice(0,10);

  // Fiéis: ativos em todos os períodos
  var totalPeriodos=periodoList.length;
  var fieis=Object.values(alunoReceita).filter(function(a){return Object.keys(a.meses).length===totalPeriodos;}).length;

  return {
    totalReceita:totalReceita,totalAlunos:totalAlunos,ticketMedio:ticketMedio,fieis:fieis,
    periodoList:periodoList,topAlunos:topAlunos,allRows:allRows,
    cols:{val:valCol,name:nameCol}
  };
}

// ── Helper: tabela completa de retenção ────────────────────────────────────
function computeTPAlunoMeses(stats){
  var alunoMeses={};
  if(!stats.cols.name||!stats.cols.val) return alunoMeses;
  stats.allRows.forEach(function(r){
    var nome=r[stats.cols.name];if(!nome) return;
    var periodo=r._periodo||"";
    var val=r[stats.cols.val];
    var rv=typeof val==="number"?val:(typeof val==="string"?parseFloat(val.replace(/[R$\s]/g,"").replace(",",".")):0);
    if(!alunoMeses[nome]) alunoMeses[nome]={n:nome,meses:{},receita:0};
    if(periodo) alunoMeses[nome].meses[periodo]=true;
    if(!isNaN(rv)) alunoMeses[nome].receita+=rv;
  });
  return alunoMeses;
}

function classifyTPAlunos(alunoMeses,totalMeses){
  var grupos={fieis:[],regulares:[],esporadicos:[]};
  Object.values(alunoMeses).forEach(function(a){
    var n=Object.keys(a.meses).length;
    var pct=n/totalMeses;
    if(pct>=0.8) grupos.fieis.push(a);
    else if(pct>=0.4) grupos.regulares.push(a);
    else grupos.esporadicos.push(a);
  });
  return grupos;
}

function computeNFStats(){
  var allRows=[];
  (dataStore.nextfit||[]).forEach(function(a){
    a.rows.forEach(function(r){
      allRows.push(Object.assign({},r,{_arquivo:a.meta.nome,_periodo:a.meta.periodo}));
    });
  });
  if(!allRows.length) return null;

  var cols=Object.keys(allRows[0]).filter(function(c){
    return c!=="_id"&&c!=="_arquivo"&&c!=="_periodo"&&c!=="_ai";
  });

  // Detectar colunas-chave
  var valCol=null,statusCol=null,planoCol=null,clienteCol=null,vencCol=null;

  cols.forEach(function(c){
    var cl=c.toLowerCase();
    if(!valCol&&(cl.indexOf("valor")>=0||cl.indexOf("liquid")>=0||cl.indexOf("total")>=0||cl.indexOf("receita")>=0)){
      var v=allRows[0][c];
      if(typeof v==="number"&&v>0) valCol=c;
    }
    if(!statusCol&&(cl.indexOf("status")>=0||cl.indexOf("situa")>=0||cl.indexOf("estado")>=0)){
      if(typeof allRows[0][c]==="string") statusCol=c;
    }
    if(!planoCol&&(cl.indexOf("plano")>=0||cl.indexOf("produto")>=0||cl.indexOf("descri")>=0||cl.indexOf("servi")>=0)){
      if(typeof allRows[0][c]==="string") planoCol=c;
    }
    if(!clienteCol&&(cl.indexOf("client")>=0||cl.indexOf("aluno")>=0||cl.indexOf("nome")>=0||cl.indexOf("devedor")>=0)){
      if(typeof allRows[0][c]==="string") clienteCol=c;
    }
    // Prioridade 1: "data de vencimento" exato
    if(!vencCol&&cl.indexOf("vencimento")>=0){
      var v=allRows[0][c];
      if(v instanceof Date||(typeof v==="string"&&v.match(/\d{2}[\/\-]\d{2}/))) vencCol=c;
    }
  });

  // Fallbacks
  if(!valCol) cols.forEach(function(c){if(!valCol&&typeof allRows[0][c]==="number"&&allRows[0][c]>10) valCol=c;});
  if(!clienteCol) cols.forEach(function(c){if(!clienteCol&&typeof allRows[0][c]==="string"&&(allRows[0][c]||"").indexOf(" ")>0) clienteCol=c;});
  // Fallback 2: qualquer coluna com "venc" no nome
  if(!vencCol) cols.forEach(function(c){
    if(!vencCol){
      var cl2=c.toLowerCase();
      if(cl2.indexOf("venc")>=0){
        var v=allRows[0][c];
        if(v instanceof Date||(typeof v==="string"&&v.match(/\d{2}[\/\-]\d{2}/))) vencCol=c;
      }
    }
  });
  // Fallback 3: competencia ou pagamento (nunca "data" genérica — pode pegar emissão)
  if(!vencCol) cols.forEach(function(c){
    if(!vencCol){
      var cl2=c.toLowerCase();
      if(cl2.indexOf("compet")>=0||cl2.indexOf("pagam")>=0){
        var v=allRows[0][c];
        if(v instanceof Date||(typeof v==="string"&&v.match(/\d{2}[\/\-]\d{2}/))) vencCol=c;
      }
    }
  });

  function getVal(r){
    var v=valCol?r[valCol]:0;
    if(typeof v==="number") return v;
    if(typeof v==="string"){var p=parseFloat(v.replace(/[R$\s]/g,"").replace(",","."));return isNaN(p)?0:p;}
    return 0;
  }
  function getDate(r){
    var v=vencCol?r[vencCol]:null;
    if(v instanceof Date){
      // SheetJS entrega Date em UTC — converter para local usando os componentes UTC
      return new Date(v.getUTCFullYear(),v.getUTCMonth(),v.getUTCDate());
    }
    if(typeof v==="string"){
      // dd/mm/yyyy
      var dm=v.match(/(\d{2})\/(\d{2})\/(\d{4})/);
      if(dm) return new Date(parseInt(dm[3]),parseInt(dm[2])-1,parseInt(dm[1]));
      // yyyy-mm-dd
      var dm2=v.match(/(\d{4})-(\d{2})-(\d{2})/);
      if(dm2) return new Date(parseInt(dm2[1]),parseInt(dm2[2])-1,parseInt(dm2[3]));
    }
    return null;
  }
  function getMes(r){
    var dt=getDate(r);
    if(!dt) return "";
    return nomeMes(dt.getMonth()+1)+"/"+String(dt.getFullYear()).slice(2);
  }

  // Agregações
  var totalReceita=0,totalCancelado=0,statusMapa={},planoMapa={},mesMapa={},clienteMapa={};

  allRows.forEach(function(r){
    var val=getVal(r);
    var status=statusCol?String(r[statusCol]||"").trim():"";
    var plano=planoCol?String(r[planoCol]||"").trim():"";
    var mes=getMes(r);
    var cliente=clienteCol?String(r[clienteCol]||"").trim():"";

    // Receita: só cobranças recebidas/pagas
    var isRecebido=status.toLowerCase().indexOf("receb")>=0||status.toLowerCase().indexOf("pago")>=0||status.toLowerCase().indexOf("liquid")>=0;
    var isCancelado=status.toLowerCase().indexOf("cancel")>=0;
    if(isRecebido) totalReceita+=val;
    if(isCancelado) totalCancelado+=val;

    // Status
    if(status){
      if(!statusMapa[status]) statusMapa[status]={label:status,n:0,receita:0};
      statusMapa[status].n++;
      if(isRecebido) statusMapa[status].receita+=val;
    }

    // Plano
    if(plano&&plano.length>2){
      if(!planoMapa[plano]) planoMapa[plano]={label:plano,n:0,receita:0};
      planoMapa[plano].n++;
      if(isRecebido) planoMapa[plano].receita+=val;
    }

    // Por mês
    if(mes){
      if(!mesMapa[mes]) mesMapa[mes]={label:mes,n:0,receita:0};
      mesMapa[mes].n++;
      if(isRecebido) mesMapa[mes].receita+=val;
    }

    // Por cliente
    if(cliente){
      if(!clienteMapa[cliente]) clienteMapa[cliente]={n:cliente,count:0,receita:0};
      clienteMapa[cliente].count++;
      if(isRecebido) clienteMapa[cliente].receita+=val;
    }
  });

  // Ordenar
  var mesesOrder=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  var mesList=Object.values(mesMapa).sort(function(a,b){
    var ya=parseInt(a.label.slice(-2)),yb=parseInt(b.label.slice(-2));
    var ma=mesesOrder.indexOf(a.label.slice(0,3)),mb=mesesOrder.indexOf(b.label.slice(0,3));
    return ya!==yb?ya-yb:ma-mb;
  });

  var statusList=Object.values(statusMapa).sort(function(a,b){return b.n-a.n;});
  var planoList=Object.values(planoMapa).sort(function(a,b){return b.receita-a.receita;}).slice(0,8);
  var topClientes=Object.values(clienteMapa).sort(function(a,b){return b.receita-a.receita;}).slice(0,10);

  var taxaCancelamento=totalReceita+totalCancelado>0?(totalCancelado/(totalReceita+totalCancelado)*100).toFixed(1):0;
  var totalAlunos=Object.keys(clienteMapa).length;

  return {
    total:allRows.length,totalReceita:totalReceita,totalCancelado:totalCancelado,
    taxaCancelamento:taxaCancelamento,totalAlunos:totalAlunos,
    mesList:mesList,statusList:statusList,planoList:planoList,topClientes:topClientes,
    allRows:allRows,getVal:getVal,getMes:getMes,
    cols:{val:valCol,status:statusCol,plano:planoCol,cliente:clienteCol,venc:vencCol}
  };
}

// ─── INADIMPLÊNCIA ────────────────────────────────────────────────────────
function pgInad(c){
  var ra=alertRed,rad=alertRedDim,rm=alertOrange,rmd=alertOrangeDim,rb=alertBlue,rbd=alertBlueDim,rr=alertGreen,rrd=alertGreenDim;

  var nfStats=computeNFStats();
  var hoje=new Date();

  // Extrair cobranças não pagas do NextFit
  var INADIMP=[];
  if(nfStats){
    var allRows=[];
    (dataStore.nextfit||[]).forEach(function(a){a.rows.forEach(function(r){allRows.push(r);});});
    // Detectar colunas
    var cols=allRows.length?Object.keys(allRows[0]).filter(function(c){return c!=="_id"&&c!=="_arquivo"&&c!=="_periodo";}):[];
    var clienteCol=null,planoCol=null,vencCol=null,valCol=null,statusCol=null,consultorCol=null;
    cols.forEach(function(c){
      var cl=c.toLowerCase();
      if(!clienteCol&&(cl.indexOf("client")>=0||cl.indexOf("aluno")>=0||cl.indexOf("nome")>=0)) if(typeof allRows[0][c]==="string") clienteCol=c;
      if(!planoCol&&(cl.indexOf("descri")>=0||cl.indexOf("plano")>=0||cl.indexOf("produto")>=0)) if(typeof allRows[0][c]==="string") planoCol=c;
      if(!vencCol&&cl.indexOf("vencimento")>=0) vencCol=c;
      if(!valCol&&(cl.indexOf("valor")>=0)&&cl.indexOf("receb")<0&&cl.indexOf("credit")<0&&cl.indexOf("desc")<0&&cl.indexOf("mult")<0&&cl.indexOf("taxa")<0) if(typeof allRows[0][c]==="number"&&allRows[0][c]>0) valCol=c;
      if(!statusCol&&(cl.indexOf("situa")>=0||cl.indexOf("status")>=0)) if(typeof allRows[0][c]==="string") statusCol=c;
      if(!consultorCol&&cl.indexOf("consultor")>=0) if(typeof allRows[0][c]==="string") consultorCol=c;
    });

    allRows.forEach(function(r){
      var status=statusCol?String(r[statusCol]||"").trim().toLowerCase():"";
      // Só inadimplentes: não recebidos, não cancelados
      var recebido=status.indexOf("receb")>=0||status.indexOf("pago")>=0||status.indexOf("liquid")>=0;
      var cancelado=status.indexOf("cancel")>=0;
      if(recebido||cancelado) return;

      var val=valCol?(typeof r[valCol]==="number"?r[valCol]:parseFloat(String(r[valCol]||"0").replace(/[R$\s]/g,"").replace(",","."))||0):0;
      if(val<=0) return;

      // Data de vencimento
      var venc=vencCol?r[vencCol]:null;
      var dt=null;
      if(venc instanceof Date) dt=new Date(venc.getUTCFullYear(),venc.getUTCMonth(),venc.getUTCDate());
      else if(typeof venc==="string"){
        var m=venc.match(/(\d{2})\/(\d{2})\/(\d{4})/);
        if(m) dt=new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
        else{var m2=venc.match(/(\d{4})-(\d{2})-(\d{2})/);if(m2) dt=new Date(parseInt(m2[1]),parseInt(m2[2])-1,parseInt(m2[3]));}
      }
      if(!dt||dt>hoje) return; // só vencidos

      var dias=Math.floor((hoje-dt)/(1000*60*60*24));
      var risco=dias>60?"alto":dias>30?"medio":"baixo";
      var vencStr=(dt.getDate()<10?"0":"")+dt.getDate()+"/"+(dt.getMonth()<9?"0":"")+(dt.getMonth()+1)+"/"+String(dt.getFullYear()).slice(2);

      INADIMP.push({
        n:clienteCol?String(r[clienteCol]||""):"—",
        p:planoCol?String(r[planoCol]||"").slice(0,30):"—",
        v:vencStr,
        val:val,
        dias:dias,
        r:risco,
        c:consultorCol?String(r[consultorCol]||""):"",
        mes:nomeMes(dt.getMonth()+1)+"/"+String(dt.getFullYear()).slice(2)
      });
    });
    // Ordenar por dias em atraso (maior primeiro)
    INADIMP.sort(function(a,b){return b.dias-a.dias;});
  }

  var data=inadF==="todos"?INADIMP:INADIMP.filter(function(i){return i.r===inadF;});
  var alto=INADIMP.filter(function(i){return i.r==="alto";});
  var med=INADIMP.filter(function(i){return i.r==="medio";});
  var bx=INADIMP.filter(function(i){return i.r==="baixo";});
  var sumR=function(arr){return arr.reduce(function(a,b){return a+b.val;},0);};

  var h=sh("Inadimplência","Cobranças vencidas · visão de risco · NextFit");

  // Sem dados
  if(!nfStats){
    h+=el("div",{style:"background:"+card+";border-radius:12px;border:0.5px solid "+brd+";padding:60px 40px;text-align:center;"},[

// ─── RETENÇÃO 360° ────────────────────────────────────────────────────────
function pgRet(c){
  var h=sh("Retenção 360°","Rastreamento de migração entre plataformas");

  // Verificar se há dados
  if(!unifiedBase.length){
    h+=el("div",{style:"background:"+card+";border-radius:12px;border:0.5px solid "+brd+";padding:60px 40px;text-align:center;"},[
      el("i",{"class":"ti ti-arrows-exchange","style":"font-size:52px;color:"+ter+";display:block;margin-bottom:16px;","aria-hidden":"true"},""),
      el("div",{style:"font-size:16px;font-weight:700;color:"+txt+";margin-bottom:8px;"},"Nenhum dado importado ainda"),
      el("div",{style:"font-size:12px;color:"+mut+";"},"Importe arquivos das 3 fontes para visualizar a retenção.")
    ].join(""));
    c.innerHTML=h; return;
  }

  // ── Linha do tempo por aluno (DERIVADO da Base Unificada — fonte única) ───
  // Pass: gpMes/tpMes (Jan..Jun = índice 0..5). NF: cobranças tipo "plano" com data real.
  // Assim Migraram + Em transição = Convertidos (multiplas), batendo com Consolidado.
  function mesInfoNF(dataStr){
    var m=String(dataStr||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m){var yy=parseInt(m[3],10),mm=parseInt(m[2],10);return {idx:(yy-2026)*12+(mm-1),label:nomeMes(mm)+"/"+String(yy).slice(2)};}
    var m2=String(dataStr||"").match(/(\d{4})-(\d{2})-(\d{2})/);
    if(m2){var y2=parseInt(m2[1],10),x2=parseInt(m2[2],10);return {idx:(y2-2026)*12+(x2-1),label:nomeMes(x2)+"/"+String(y2).slice(2)};}
    return null;
  }

  var migrados=[];     // estava no pass, fechou plano, saiu do pass
  var emTransicao=[];  // tem pass + plano ao mesmo tempo
  var soPPass=[];      // só pass, sem plano presencial
  var soNF=[];         // só plano, nunca foi pass

  unifiedBase.forEach(function(m){
    var temGP=!!m.gp, temTP=!!m.tp, temPass=temGP||temTP;
    var temNF=!!(m.nf&&m.nf.temPlano); // só plano presencial conta como conversão
    var de=temGP&&temTP?"GP+TP":temGP?"Gympass":"Totalpass";

    if(!temPass&&temNF){ soNF.push({nome:m.nome,item:m}); return; }
    if(temPass&&!temNF){ soPPass.push({nome:m.nome,item:m,de:de}); return; }
    if(!temPass&&!temNF) return;

    // meses de pass (Jan..Jun)
    var passMeses=[];
    for(var i=0;i<6;i++){ if((m.gpMes&&m.gpMes[i]>0)||(m.tpMes&&m.tpMes[i]>0)) passMeses.push({idx:i,label:nomeMes(i+1)+"/26"}); }
    // meses de plano presencial (data real de recebimento)
    var planoMeses=(m.nf.cobrancas||[]).filter(function(c){return classNF(c.desc)==="plano";})
      .map(function(c){return mesInfoNF(c.data);}).filter(function(x){return x;})
      .sort(function(a,b){return a.idx-b.idx;});

    var passIni=passMeses.length?passMeses[0]:null;
    var passFim=passMeses.length?passMeses[passMeses.length-1]:null;
    var nfIni=planoMeses.length?planoMeses[0]:null;

    var entry={nome:m.nome,de:de,item:m,nf:m.nf,
      mesPassInicio:passIni?passIni.label:"—",
      mesNFInicio:nfIni?nfIni.label:"—"};

    var passAntes=passIni&&nfIni&&passIni.idx<=nfIni.idx;     // entrou no pass antes/junto do plano
    var aindaNoPass=passFim&&nfIni&&passFim.idx>nfIni.idx;    // continua no pass depois do plano
    if(passAntes&&!aindaNoPass) migrados.push(entry); else emTransicao.push(entry);
  });

  // ── KPIs ─────────────────────────────────────────────────────────────────
  var totalPass=soPPass.length+migrados.length+emTransicao.length;
  var txConversao=totalPass>0?Math.round(migrados.length/totalPass*100):0;

  h+=el("div",{style:"display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;"},[

    mc("Em Transição",""+emTransicao.length,"ti-arrows-exchange",alertBlue,"pass + plano direto simultâneo"),
    mc("Só Pass",""+soPPass.length,"ti-user-x",alertOrange,"nunca tiveram plano direto"),
    mc("Taxa de Conversão",txConversao+"%","ti-percentage",GOLD,"do total de alunos pass")
  ].join(""));

  // ── Tabela de migrados ────────────────────────────────────────────────────
  h+=el("div",{style:"background:"+card+";border-radius:10px;border:0.5px solid "+brd+";overflow:hidden;margin-bottom:14px;"},[
    el("div",{style:"padding:12px 16px;border-bottom:0.5px solid "+brd+";background:"+alertGreenDim+";display:flex;align-items:center;justify-content:space-between;"},[
      el("div",{},[
        el("div",{style:"font-size:13px;font-weight:700;color:#ffffff;"},"✅ Conversões confirmadas para NextFit"),
        el("div",{style:"font-size:11px;color:#a0d4b8;margin-top:2px;"},"Alunos que estavam no pass e fecharam plano direto")
      ]),
      el("span",{style:"font-size:20px;font-weight:900;color:"+alertGreen+";"},""+migrados.length)
    ].join("")),
    migrados.length===0
      ?el("div",{style:"padding:30px;text-align:center;color:"+mut+";font-size:12px;"},"Nenhuma migração identificada ainda.")
      :el("table",{style:"width:100%;border-collapse:collapse;font-size:11px;"},[
        el("thead",{},el("tr",{style:"background:"+tblRow+";border-bottom:0.5px solid "+brd+";"},
          ["Aluno","Veio de","Entrou no Pass","Entrou no NF","Plano","Receita"].map(function(hh,i){
            return el("th",{style:"padding:8px 14px;text-align:"+(i===5?"right":"left")+";color:"+ter+";font-weight:600;"},hh);
          }).join(""))),
        el("tbody",{},migrados.map(function(r,i){
          var sc={Gympass:green,Totalpass:orange,"GP+TP":alertBlue}[r.de]||mut;
          return el("tr",{"data-action":"ub-open","data-val":""+r.item.id,style:"cursor:pointer;border-bottom:0.5px solid "+faint+";"+(i%2===1?"background:"+tblRow:"")},[
            el("td",{style:"padding:8px 14px;font-weight:600;color:"+txt+";"},r.nome),
            el("td",{style:"padding:8px 14px;"},el("span",{style:"font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;background:"+sc+"22;color:"+sc+";"},r.de)),
            el("td",{style:"padding:8px 14px;color:"+mut+";"},r.mesPassInicio||"—"),
            el("td",{style:"padding:8px 14px;color:"+alertGreen+";font-weight:700;"},r.mesNFInicio||"—"),
            el("td",{style:"padding:8px 14px;color:"+mut+";"},r.nf&&r.nf.plano?r.nf.plano.slice(0,25):"—"),
            el("td",{style:"padding:8px 14px;text-align:right;font-weight:700;color:"+alertGreen+";"},r.nf&&r.nf.receita?fmt(r.nf.receita):"—")
          ].join(""));
        }).join(""))
      ].join(""))
  ].join(""));

  // ── Tabela em transição ───────────────────────────────────────────────────
  if(emTransicao.length>0){
    h+=el("div",{style:"background:"+card+";border-radius:10px;border:0.5px solid "+brd+";overflow:hidden;margin-bottom:14px;"},[
      el("div",{style:"padding:12px 16px;border-bottom:0.5px solid "+brd+";background:"+alertBlueDim+";display:flex;align-items:center;justify-content:space-between;"},[
        el("div",{},[
          el("div",{style:"font-size:13px;font-weight:700;color:#ffffff;"},"⚡ Em Transição — pass + plano direto simultâneo"),
          el("div",{style:"font-size:11px;color:#a0c4e8;margin-top:2px;"},"Ainda não saíram do pass mas já têm NextFit")
        ]),
        el("span",{style:"font-size:20px;font-weight:900;color:"+alertBlue+";"},""+emTransicao.length)
      ].join("")),
      el("table",{style:"width:100%;border-collapse:collapse;font-size:11px;"},[
        el("thead",{},el("tr",{style:"background:"+tblRow+";border-bottom:0.5px solid "+brd+";"},
          ["Aluno","Veio de","Entrou no Pass","Entrou no NF","Plano"].map(function(hh,i){
            return el("th",{style:"padding:8px 14px;text-align:left;color:"+ter+";font-weight:600;"},hh);
          }).join(""))),
        el("tbody",{},emTransicao.map(function(r,i){
          var sc={Gympass:green,Totalpass:orange,"GP+TP":alertBlue}[r.de]||mut;
          return el("tr",{"data-action":"ub-open","data-val":""+r.item.id,style:"cursor:pointer;border-bottom:0.5px solid "+faint+";"+(i%2===1?"background:"+tblRow:"")},[
            el("td",{style:"padding:8px 14px;font-weight:600;color:"+txt+";"},r.nome),

            el("td",{style:"padding:8px 14px;color:"+mut+";"},r.mesPassInicio||"—"),
            el("td",{style:"padding:8px 14px;color:"+alertBlue+";font-weight:700;"},r.mesNFInicio||"—"),
            el("td",{style:"padding:8px 14px;color:"+mut+";"},r.nf&&r.nf.plano?r.nf.plano.slice(0,25):"—")
          ].join(""));
        }).join(""))
      ].join(""))
    ].join(""));
  }

  // ── Estratégia baseada nos dados reais ───────────────────────────────────
  var fieisSemNF=soPPass.filter(function(a){return a.item&&a.item.perfil==="fiel";});
  h+=el("div",{style:"background:#1a1500;border-radius:10px;border:0.5px solid "+GOLD+"33;padding:16px;"},[

// ─── UPLOAD / PARSE ───────────────────────────────────────────────────────
function pfile(file){
  var fonte=document.querySelector("[name=fonte]:checked");
  fonte=fonte?fonte.value:"NextFit";
  var key=fonte.toLowerCase();
  var fb=document.getElementById("ufb");
  fb.style.display="block";
  fb.innerHTML=el("div",{style:"background:"+alertBlueDim+";border-radius:8px;padding:12px;display:flex;align-items:center;gap:10px;"},[
    el("i",{"class":"ti ti-loader","style":"font-size:16px;color:"+alertBlue+";","aria-hidden":"true"},""),
    el("span",{style:"font-size:12px;color:"+alertBlue+";"},"Lendo "+file.name+" com SheetJS...")
  ].join(""));
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var isCSV=file.name.toLowerCase().endsWith(".csv");
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true,codepage:isCSV?65001:undefined});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      var parsed=rows.map(function(r,i){return Object.assign({_id:i+1},r);});

      // ── NORMALIZAÇÃO DE COLUNAS ──────────────────────────────────────────
      // Classifica cada coluna e normaliza os valores para evitar erros de
      // formatação (IDs como R$, CEPs sem zero, CPF formatado errado, etc.)
      if(parsed.length>0){
        var sampleSize=Math.min(100,parsed.length);
        var cols0=Object.keys(parsed[0]).filter(function(c){return c!=="_id";});

        // Metadados por coluna: tipo detectado e configurações de exibição
        var colMeta={};

        cols0.forEach(function(col){
          var colLow=col.toLowerCase().replace(/[_\s\-]/g,"");
          var sample=[];
          for(var si=0;si<sampleSize;si++){
            var v=parsed[si][col];
            if(v!==null&&v!==undefined&&v!=="") sample.push(v);
          }
          if(sample.length===0){colMeta[col]={tipo:"texto"};return;}

          var numVals=sample.filter(function(v){return typeof v==="number";});
          var strVals=sample.filter(function(v){return typeof v==="string"&&v.trim()!=="";});
          var pctNum=numVals.length/sample.length;
          var pctStr=strVals.length/sample.length;

          // ── Regra 1: COLUNA MISTA ──────────────────────────────────────
          // Se mais de 20% dos valores são texto → coluna inteira é texto
          // EXCETO se o nome da coluna indicar claramente valor financeiro
          var isFinancialCol=["valor","receita","repasse","liquido","liquid","pag","total","preco","custo","taxa"].some(function(k){
            return colLow.indexOf(k)>=0;
          });
          if(pctStr>=0.2&&pctNum>0&&!isFinancialCol){
            colMeta[col]={tipo:"texto"};return;
          }

          // ── A partir daqui, tratamos colunas majoritariamente numéricas ─
          if(pctNum<0.5){colMeta[col]={tipo:"texto"};return;}

          var intVals=numVals.filter(function(v){return Number.isInteger(v);});
          var allIntegers=intVals.length===numVals.length;

          // ── Regra 2: CPF / CNPJ ────────────────────────────────────────
          // CPF: 11 dígitos | CNPJ: 14 dígitos
          // Verificar pelo nome da coluna E pelo conteúdo
          var nameCPF=["cpf","cnpj","documento","doc","cadastro"].some(function(k){return colLow.indexOf(k)>=0;});
          if(nameCPF||( allIntegers&&numVals.length>0 )){
            var digits=numVals.map(function(v){return String(Math.abs(Math.round(v))).length;});
            var avg=digits.reduce(function(a,b){return a+b;},0)/digits.length;
            var isCPF=avg>=9&&avg<=11;
            var isCNPJ=avg>=12&&avg<=14;
            if(nameCPF||isCPF||isCNPJ){
              colMeta[col]={tipo:"documento",subTipo:isCNPJ?"cnpj":"cpf"};return;
            }
          }

          // ── Regra 3: CEP ───────────────────────────────────────────────
          // 8 dígitos, começa com dígito 0-9, todos na faixa 1000000-99999999
          var nameCEP=["cep","zip","postal"].some(function(k){return colLow.indexOf(k)>=0;});
          if(allIntegers&&numVals.length>0){
            var cepDigits=numVals.map(function(v){return String(Math.abs(Math.round(v))).length;});
            var cepAvg=cepDigits.reduce(function(a,b){return a+b;},0)/cepDigits.length;
            var inCEPRange=numVals.every(function(v){return v>=1000000&&v<=99999999;});
            if(nameCEP||(cepAvg>=7&&cepAvg<=8&&inCEPRange)){
              colMeta[col]={tipo:"cep"};return;
            }
          }

          // ── Regra 4: TELEFONE ──────────────────────────────────────────
          // 10-11 dígitos inteiros
          var nameTel=["telefone","tel","fone","celular","cel","whatsapp","contato","phone"].some(function(k){return colLow.indexOf(k)>=0;});
          if(allIntegers&&numVals.length>0){
            var telDigits=numVals.map(function(v){return String(Math.abs(Math.round(v))).length;});
            var telAvg=telDigits.reduce(function(a,b){return a+b;},0)/telDigits.length;
            if(nameTel||(telAvg>=10&&telAvg<=11)){
              colMeta[col]={tipo:"texto"};return;
            }
          }

          // ── Regra 5: ID / CÓDIGO (nome ou magnitude) ───────────────────
          var nameIsId=["id","codigo","cod","matricula","protocolo","numero","num","ref","referencia","chave","key","hash","token","registro","reg"].some(function(k){
            return colLow===k||colLow.indexOf(k)>=0;
          });
          if(!nameIsId&&allIntegers&&numVals.length>1){
            var minV=Math.min.apply(null,numVals);
            var maxV=Math.max.apply(null,numVals);
            var minD=String(Math.abs(Math.round(minV))).length;
            var maxD=String(Math.abs(Math.round(maxV))).length;
            var sameMag=(minD===maxD||Math.abs(minD-maxD)<=1)&&minD>=4&&(maxV===0||maxV/Math.max(1,Math.abs(minV))<50);
            if(sameMag) nameIsId=true;
          }
          if(nameIsId){colMeta[col]={tipo:"texto"};return;}

          // ── Regra 6: PORCENTAGEM ───────────────────────────────────────
          // Valores entre 0 e 1 com casas decimais → percentual
          var namePct=["pct","percent","taxa","rate","proporcao","propor"].some(function(k){return colLow.indexOf(k)>=0;});
          var allBetween0and1=numVals.every(function(v){return v>=0&&v<=1;});
          var hasDecimals=numVals.some(function(v){return !Number.isInteger(v);});
          if(namePct||(allBetween0and1&&hasDecimals&&numVals.length>0)){
            colMeta[col]={tipo:"percentual"};return;
          }

          // ── Regra 7: MUITOS ZEROS → não somar no total ─────────────────
          var zeroCount=numVals.filter(function(v){return v===0;}).length;
          var pctZero=zeroCount/numVals.length;
          if(pctZero>=0.6){
            colMeta[col]={tipo:"numero",naoSomar:true};return;
          }

          // Padrão: coluna numérica financeira
          colMeta[col]={tipo:"numero"};
        });

        // ── Aplicar normalização nos dados ─────────────────────────────────
        parsed=parsed.map(function(r){
          var r2=Object.assign({},r);
          cols0.forEach(function(col){
            var meta=colMeta[col]||{tipo:"numero"};
            var v=r2[col];
            if(v===null||v===undefined||v==="") return;

            if(meta.tipo==="texto"||meta.tipo==="documento"){
              // Converter número para string preservando zeros à esquerda
              if(typeof v==="number"){
                var s=String(Math.abs(Math.round(v)));
                // CPF: garantir 11 dígitos com zeros à esquerda
                if(meta.subTipo==="cpf"&&s.length<=11) s=s.padStart(11,"0");
                // CNPJ: garantir 14 dígitos
                if(meta.subTipo==="cnpj"&&s.length<=14) s=s.padStart(14,"0");
                r2[col]=s;
              }
            } else if(meta.tipo==="cep"){
              if(typeof v==="number"){
                r2[col]=String(Math.round(v)).padStart(8,"0");
              }
            }
            // Percentual e numero: manter como número, só marcar metadado
          });
          return r2;
        });

        // Salvar metadados para uso posterior no grid (guardado no meta do arquivo)
        var _colMetaResult=colMeta;
      }
      // ────────────────────────────────────────────────────────────────────
      var periodo=detectPeriodo(file.name,parsed);
      var jaExiste=-1;
      dataStore[key].forEach(function(a,i){if(a.meta.nome===file.name) jaExiste=i;});
      var totalVal=0;
      if(parsed.length){
        var numCols2=Object.keys(parsed[0]).filter(function(c){return c!=="id"&&typeof parsed[0][c]==="number"&&parsed[0][c]>10;});
        if(numCols2.length) totalVal=parsed.reduce(function(s,r){return s+(r[numCols2[0]]||0);},0);
      }
      var meta={

// ═══════════════════════════════════════════════════════════════════════════
// BASE UNIFICADA DE ALUNOS — match fuzzy entre as 3 fontes
// ═══════════════════════════════════════════════════════════════════════════

function normName(n){
  if(!n) return "";
  return n.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // remove acentos
    .replace(/[^a-z\s]/g,"")                          // só letras e espaços
    .replace(/\s+/g," ").trim();
}

function tokenSim(a,b){
  // Similaridade por tokens: quantas palavras em comum / total único
  var ta=normName(a).split(" ").filter(function(w){return w.length>2;});
  var tb=normName(b).split(" ").filter(function(w){return w.length>2;});
  if(!ta.length||!tb.length) return 0;
  var common=ta.filter(function(w){return tb.indexOf(w)>=0;}).length;
  var total=Math.max(ta.length,tb.length);
  return common/total;
}

function jaroSim(s1,s2){
  // Jaro similarity
  s1=normName(s1); s2=normName(s2);
  if(s1===s2) return 1;
  var l1=s1.length,l2=s2.length;
  if(!l1||!l2) return 0;
  var matchDist=Math.floor(Math.max(l1,l2)/2)-1;
  if(matchDist<0) matchDist=0;
  var s1m=new Array(l1).fill(false),s2m=new Array(l2).fill(false);
  var matches=0,transpos=0;
  for(var i=0;i<l1;i++){
    var lo=Math.max(0,i-matchDist),hi=Math.min(i+matchDist+1,l2);
    for(var j=lo;j<hi;j++){
      if(s2m[j]||s1[i]!==s2[j]) continue;
      s1m[i]=s2m[j]=true; matches++; break;
    }
  }
  if(!matches) return 0;
  var k=0;
  for(var i2=0;i2<l1;i2++){
    if(!s1m[i2]) continue;
    while(!s2m[k]) k++;
    if(s1[i2]!==s2[k]) transpos++;
    k++;
  }
  return (matches/l1+matches/l2+(matches-transpos/2)/matches)/3;
}

function nameSim(a,b){
  var STOP={"da":1,"de":1,"do":1,"dos":1,"das":1,"e":1,"a":1,"o":1};
  var SOBRENOMES_COMUNS={"silva":1,"santos":1,"oliveira":1,"almeida":1,"souza":1,
    "lima":1,"costa":1,"pereira":1,"ferreira":1,"rodrigues":1,"carvalho":1,"gomes":1,"martins":1};
  // Lixo de fonte grudado no cadastro (ex.: "Camila Guedes TOTALPASS" no NextFit). Sem isso, esses
  // tokens derrubam o score a 0 e o aluno some — nem funde, nem entra na revisão. Limpa p/ TODAS as fontes.
  var LIXO_FONTE={"totalpass":1,"gympass":1,"wellhub":1};
  function toks(n){return normName(n).split(" ").filter(function(w){return w.length>1&&!STOP[w]&&!LIXO_FONTE[w];});}
  var ta=toks(a), tb=toks(b);
  if(!ta.length||!tb.length) return 0;
  // Nome IDÊNTICO (normalizado) = mesma pessoa, mesmo com sobrenome comum (Joel Costa, Cida Silva).
  // Homônimo real (mesmo nome+sobrenome, pessoas distintas) numa academia única é raríssimo, e todo
  // par observado era complementar (um lado plano, outro pass = mesma pessoa). Auditável no painel Fusões.
  // 1 token só (só primeiro nome) ainda NÃO funde — segue o caminho conservador abaixo.
  if(ta.join(" ")===tb.join(" ")&&ta.length>=2) return 1;
  // Pré-requisito 1: primeiro nome idêntico
  if(ta[0]!==tb[0]) return 0;
  // Pré-requisito 2: se ambos têm só 2 tokens — inelegível para fuzzy
  if(ta.length<=2&&tb.length<=2) return 0;
  // Regra especial: nome curto (2 tokens) com sobrenome não comum
  // → verifica se os 2 tokens estão contidos no nome maior
  if(ta.length===2&&!SOBRENOMES_COMUNS[ta[ta.length-1]]){
    return ta.every(function(t){return tb.indexOf(t)>=0;})?0.85:0;
  }
  if(tb.length===2&&!SOBRENOMES_COMUNS[tb[tb.length-1]]){
    return tb.every(function(t){return ta.indexOf(t)>=0;})?0.85:0;
  }
  // Regra geral: último nome idêntico
  if(ta[ta.length-1]!==tb[tb.length-1]) return 0;
  // Passou em tudo — calcula score normal
  var jaro=jaroSim(a,b);
  var token=tokenSim(a,b);
  return Math.max(jaro*0.6+token*0.4, token);
}

function simLabel(score){
  if(score>=0.88) return "alta";
  if(score>=0.65) return "media";
  return "baixa";
}

function extractNFAlunos(){
  // Extrai lista de alunos únicos do NextFit com nome, plano, valor
  var rows=[];
  (dataStore.nextfit||[]).forEach(function(a){
    a.rows.forEach(function(r){rows.push(Object.assign({},r,{_periodo:a.meta.periodo}));});
  });
  if(!rows.length) return [];
  var cols=Object.keys(rows[0]).filter(function(c){return c!=="_id"&&c!=="_arquivo"&&c!=="_periodo";});
  var clienteCol=null,valCol=null,planoCol=null,statusCol=null,recCol=null,vencCol=null,emisCol=null;
  cols.forEach(function(c){
    var cl=c.toLowerCase();
    if(!clienteCol&&(cl.indexOf("client")>=0||cl.indexOf("aluno")>=0||cl.indexOf("nome")>=0||cl.indexOf("devedor")>=0))
      if(typeof rows[0][c]==="string") clienteCol=c;
    if(!valCol&&(cl.indexOf("valor")>=0||cl.indexOf("liquid")>=0||cl.indexOf("total")>=0||cl.indexOf("receita")>=0))
      if(typeof rows[0][c]==="number"&&rows[0][c]>0) valCol=c;
    if(!planoCol&&(cl.indexOf("plano")>=0||cl.indexOf("produto")>=0||cl.indexOf("descri")>=0))
      if(typeof rows[0][c]==="string") planoCol=c;
    if(!statusCol&&(cl.indexOf("status")>=0||cl.indexOf("situa")>=0))
      if(typeof rows[0][c]==="string") statusCol=c;
    if(cl.indexOf("data")>=0){
      if(!recCol&&cl.indexOf("receb")>=0) recCol=c;
      else if(!vencCol&&cl.indexOf("vencim")>=0) vencCol=c;
      else if(!emisCol&&cl.indexOf("emiss")>=0) emisCol=c;
    }
  });
  if(!clienteCol) cols.forEach(function(c){if(!clienteCol&&typeof rows[0][c]==="string"&&(rows[0][c]||"").indexOf(" ")>0) clienteCol=c;});
  if(!valCol) cols.forEach(function(c){if(!valCol&&typeof rows[0][c]==="number"&&rows[0][c]>10) valCol=c;});
  // Agrupar por nome
  var mapa={};
  rows.forEach(function(r){
    var n=clienteCol?r[clienteCol]:"";
    if(!n) return;
    // Remove lixo de fonte grudado no cadastro do NextFit ("Camila Guedes TOTALPASS" → "Camila Guedes").
    n=String(n).replace(/\b(total\s*pas?s?|gym\s*pass|gympass|wellhub)\b/ig,"").replace(/\s+/g," ").trim();
    if(!n) return;
    if(!mapa[n]) mapa[n]={nome:n,receita:0,plano:"",status:"",cobr:0,cobrancas:[],temPlano:false,temPlanilha:false,temAvulso:false};
    var v=valCol?(typeof r[valCol]==="number"?r[valCol]:parseFloat(String(r[valCol]).replace(/[R$\s]/g,"").replace(",","."))||0):0;
    mapa[n].receita+=v;
    mapa[n].cobr++;
    var _desc=planoCol?(r[planoCol]||""):"";
    var _data=(recCol&&r[recCol])||(vencCol&&r[vencCol])||(emisCol&&r[emisCol])||"";
    mapa[n].cobrancas.push({desc:_desc,valor:v,data:_data});
    var _t=classNF(_desc);
    if(_t==="plano") mapa[n].temPlano=true; else if(_t==="planilha") mapa[n].temPlanilha=true; else mapa[n].temAvulso=true;
    if(planoCol&&r[planoCol]) mapa[n].plano=r[planoCol];
    if(statusCol&&r[statusCol]) mapa[n].status=r[statusCol];
  });
  return Object.values(mapa);
}

    if(id) mapa[n].ids[id]=true;
    var v=valCol?(typeof r[valCol]==="number"?r[valCol]:parseFloat(String(r[valCol]).replace(/[R$\s]/g,"").replace(",","."))||0):0;
    mapa[n].receita+=v;
    var dtCol2=null;
    cols.forEach(function(c){var cl=c.toLowerCase();if(!dtCol2&&(cl.indexOf("data")>=0||cl.indexOf("date")>=0||cl.indexOf("mes")>=0)) dtCol2=c;});
    if(dtCol2&&r[dtCol2]){
      var v2=r[dtCol2]; var dt=null;
      if(v2 instanceof Date) dt=new Date(v2.getUTCFullYear(),v2.getUTCMonth(),v2.getUTCDate());
      else if(typeof v2==="string"){
        var dm=v2.match(/(\d{2})\/(\d{2})\/(\d{4})/);
        if(dm) dt=new Date(parseInt(dm[3]),parseInt(dm[2])-1,parseInt(dm[1]));
        else{var dm2=v2.match(/(\d{4})-(\d{2})-(\d{2})/);if(dm2) dt=new Date(parseInt(dm2[1]),parseInt(dm2[2])-1,parseInt(dm2[3]));}
      }
      if(dt) mapa[n].datas.push(dt);
    }
  });

  // ── Dedup interno: ID Wellhub como regra primária ─────────────────────────
  var entries=Object.values(mapa);
  var merged=[];
  var usado=new Array(entries.length).fill(false);
  var gpFusoes=[]; var gpPossiveis=[];
  for(var i=0;i<entries.length;i++){
    if(usado[i]) continue;
    var base={nome:entries[i].nome,checkins:entries[i].checkins,receita:entries[i].receita,
              datas:entries[i].datas.slice(),ids:Object.assign({},entries[i].ids)};
    for(var j=i+1;j<entries.length;j++){
      if(usado[j]) continue;
      // Regra primária: mesmo ID Wellhub
      var idsA=Object.keys(base.ids);
      var idsB=Object.keys(entries[j].ids);
      var idComum=idsA.length>0&&idsB.length>0&&idsA.some(function(id){return idsB.indexOf(id)>=0;});
      // IDs diferentes mas existentes = pessoas diferentes, não funde
      var idsDiferentes=idsA.length>0&&idsB.length>0&&!idComum;
      if(idsDiferentes){
        // Registrar como possível apenas se nome for parecido
        var sim2=nameSim(base.nome,entries[j].nome);
        if(sim2>=0.65) gpPossiveis.push({nomeA:base.nome,fonteA:"Gympass",nomeB:entries[j].nome,fonteB:"Gympass",score:sim2,motivo:"IDs Wellhub diferentes"});
        continue;
      }
      if(idComum){
        // Mesmo ID — funde com certeza
        gpFusoes.push({nomeCanônico:base.nome.length>=entries[j].nome.length?base.nome:entries[j].nome,
          nomeFundido:base.nome.length>=entries[j].nome.length?entries[j].nome:base.nome,
          fonteA:"Gympass",fonteB:"Gympass (interno)",score:1,motivo:"ID Wellhub idêntico"});
        base.checkins+=entries[j].checkins;
        base.receita+=entries[j].receita;
        base.datas=base.datas.concat(entries[j].datas);
        Object.assign(base.ids,entries[j].ids);
        if(entries[j].nome.length>base.nome.length) base.nome=entries[j].nome;
        usado[j]=true;
      }
    }
    usado[i]=true;
    merged.push(base);
  }
  _gpFusoesTemp=gpFusoes;
  _gpPossiveisTemp=gpPossiveis;
  return merged.map(function(a){
    var res=classifyGPAluno(a.datas);
    return Object.assign({},a,{perfil:res.categoria,tendencia:res.tendencia,status:res.status,diasSemVir:res.diasSemVir});
  });
}

function extractTPAlunos(){
  // Origem Totalpass com DOIS formatos possíveis convivendo:
  //  (a) MENSAL     — "Nome" + "Valor líquido total" (receita por mês de competência)
  //  (b) VALIDAÇÕES — "Data" (data/hora) + "Cliente" + "Contrato" (1 linha por check-in diário)
  var files=(dataStore.totalpass||[]);
  if(!files.length) return [];

  function limpaTP(n){ return String(n||"").replace(/\btotal\s*pas?s?\b/ig,"").replace(/\s+/g," ").trim(); }
  function keyTP(n){ return limpaTP(n).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
  function toDateTP(v){
    if(v instanceof Date) return new Date(v.getFullYear(),v.getMonth(),v.getDate());
    if(typeof v==="string"){
      var m=v.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));
      var m2=v.match(/(\d{2})\/(\d{2})\/(\d{4})/); if(m2) return new Date(parseInt(m2[3]),parseInt(m2[2])-1,parseInt(m2[1]));
    }
    return null;
  }
  function colsDe(rows){ return Object.keys(rows[0]).filter(function(c){return c!=="_id"&&c!=="_arquivo"&&c!=="_periodo";}); }
  function acharData(rows){
    var dc=null; colsDe(rows).forEach(function(c){ if(!dc&&rows[0][c] instanceof Date) dc=c; });
    if(!dc) colsDe(rows).forEach(function(c){ var v=rows[0][c]; if(!dc&&typeof v==="string"&&/(\d{4}-\d{2}-\d{2}|\d{2}\/\d{2}\/\d{4})/.test(v)&&/\d{2}:\d{2}/.test(v)) dc=c; });
    return dc;
  }
  function acharNome(rows){
    var nc=null; colsDe(rows).forEach(function(c){ var cl=c.toLowerCase(); if(!nc&&(cl.indexOf("nome")>=0||cl.indexOf("client")>=0||cl.indexOf("aluno")>=0||cl.indexOf("benefici")>=0)&&typeof rows[0][c]==="string") nc=c; });
    if(!nc) colsDe(rows).forEach(function(c){ if(!nc&&typeof rows[0][c]==="string"&&(rows[0][c]||"").indexOf(" ")>0) nc=c; });
    return nc;
  }
  function acharValor(rows){
    var vc=null; colsDe(rows).forEach(function(c){ var cl=c.toLowerCase(); if(!vc&&(cl.indexOf("valor")>=0||cl.indexOf("liquid")>=0||cl.indexOf("repasse")>=0||cl.indexOf("receita")>=0||cl.indexOf("total")>=0)){ var v=rows[0][c]; if(typeof v==="number"&&v>0) vc=c; } });
    return vc;
  }

  var mapa={}; var periodosMensais=0;
  files.forEach(function(a){
    var rows=a.rows||[]; if(!rows.length) return;
    var dateCol=acharData(rows), nameCol=acharNome(rows), valCol=acharValor(rows);
    var ehValidacoes = !!dateCol && !!nameCol && !valCol;
    if(ehValidacoes){
      rows.forEach(function(r){
        var nm=r[nameCol]; if(!nm) return; var k=keyTP(nm);
        var d=mapa[k]||(mapa[k]={nome:limpaTP(nm),receita:0,mesesRev:{},datas:[]});
        if(limpaTP(nm).length>d.nome.length) d.nome=limpaTP(nm);
        var dt=toDateTP(r[dateCol]); if(dt) d.datas.push(dt);
      });
    } else {
      periodosMensais++;
      rows.forEach(function(r){
        var nm=nameCol?r[nameCol]:""; if(!nm) return; var k=keyTP(nm);
        var d=mapa[k]||(mapa[k]={nome:limpaTP(nm),receita:0,mesesRev:{},datas:[]});
        if(limpaTP(nm).length>d.nome.length) d.nome=limpaTP(nm);
        var v=valCol?(typeof r[valCol]==="number"?r[valCol]:parseFloat(String(r[valCol]).replace(/[R$\s]/g,"").replace(",","."))||0):0;
        d.receita+=v;
        var per=a.meta.periodo||""; if(per) d.mesesRev[per]=true;
      });
    }
  });
  // ── Fusão interna do Totalpass: nome-curto (validações) ↔ nome-completo (receita) ──
  // O extrato de validações costuma usar nome curto (1º+2º nome) e o de receita o nome completo.
  // CONSERVADOR: só funde quando o nome curto é prefixo de EXATAMENTE UM nome completo.
  _tpFusoesInternas=[];
  (function(){
    function strip(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim(); }
    function toks(n){ return strip(n).split(" ").filter(Boolean); }
    // nome curto = subsequência (mesma ordem) do completo, começando pelo mesmo 1º nome.
    // Cobre: prefixo (Mariana Egg→Mariana Egg Verotti...) e nome-do-meio omitido (Adriano Anjos→Adriano X Anjos).
    function ehSubseq(a,b){
      if(a.length<2||a.length>=b.length||a[0]!==b[0]) return false;
      var j=0; for(var i=0;i<b.length&&j<a.length;i++){ if(b[i]===a[j]) j++; }
      return j===a.length;
    }
    var ents=Object.keys(mapa).map(function(k){ return {k:k,e:mapa[k],t:toks(mapa[k].nome)}; });
    ents.forEach(function(S){
      if(!mapa[S.k]) return; // já fundido
      var cands=ents.filter(function(L){ return L!==S && mapa[L.k] && ehSubseq(S.t,L.t); });
      if(cands.length===1){
        var L=cands[0];
        L.e.receita += S.e.receita;
        Object.keys(S.e.mesesRev).forEach(function(p){ L.e.mesesRev[p]=true; });
        L.e.datas = L.e.datas.concat(S.e.datas);
        _tpFusoesInternas.push({nomeCanônico:L.e.nome,nomeFundido:S.e.nome,fonteA:"Totalpass (receita)",fonteB:"Totalpass (validações)",score:1,ckCurto:S.e.datas.length,nTok:S.t.length});
        delete mapa[S.k];
      }
    });
  })();

  var totalPeriodos=periodosMensais||1;
  return Object.values(mapa).map(function(d){
    var temDiario=d.datas.length>0;
    var cls=temDiario?classifyGPAluno(d.datas):null;
    var nRev=Object.keys(d.mesesRev).length;
    var mesChk=[1,2,3,4,5,6].map(function(mm){ return d.datas.filter(function(x){return x.getMonth()===mm-1;}).length; });
    var nChk=mesChk.filter(function(x){return x>0;}).length;
    return {
      nome:d.nome, receita:d.receita,
      meses: nChk||nRev,
      mesChk: mesChk,
      checkins: d.datas.length,
      datas: d.datas,
      perfil: temDiario?cls.categoria:classifyPerfil(nRev,totalPeriodos),
      tendencia: temDiario?cls.tendencia:"",
      status: temDiario?cls.status:"",
      diasSemVir: temDiario?cls.diasSemVir:null,
      ult: temDiario?cls.ultimoCheckin:null
    };
  });
}

function classifyPerfil(nMeses,totalMeses){
  if(!totalMeses) return "esporadico";
  var pct=nMeses/totalMeses;
  if(pct>=0.8) return "fiel";
  if(pct>=0.4) return "regular";
  return "esporadico";
}

// Tendência por RECÊNCIA: olha a trajetória dos últimos ~3 meses ativos (regressão simples),
// em vez de comparar média da 1ª metade vs 2ª metade. Reflete o momento atual do aluno.
function trendRecencia(monthly){
  var ativos=[]; (monthly||[]).forEach(function(v){ if(v>0) ativos.push(v); });
  if(ativos.length<2) return "";
  var jan=ativos.slice(-3);
  var n=jan.length, sx=0,sy=0,sxy=0,sxx=0;
  for(var i=0;i<n;i++){ sx+=i; sy+=jan[i]; sxy+=i*jan[i]; sxx+=i*i; }
  var den=(n*sxx - sx*sx)||1;
  var slope=(n*sxy - sx*sy)/den;
  if(slope>=1.5) return "crescente";
  if(slope<=-1.5) return "decrescente";
  var max=Math.max.apply(null,jan), min=Math.min.apply(null,jan), media=sy/n;
  if(n>=3 && (max-min)>=media) return "oscilante";
  return "estavel";
}

// Classifica uma cobrança do NextFit:
//  plano    = mensalidade/plano presencial (conversão real)
//  planilha = Planilha Performance (recorrente online — categoria à parte, NÃO é conversão)
//  avulso   = camiseta, drop-in, kit, clube, aluguel etc. (não é plano)
// Ordem importa: roupa primeiro (Camiseta Hyrox ≠ plano HYROX); plano antes de avulso (cobrança combinada conta como plano).
// Extrai a referência (mês/ano) embutida na descrição do NextFit. O arquivo não tem coluna de data,
// então usamos o que vem no nome do produto: "[2026 Fev]" → Fev/26, "[2026]" → 2026, "...2025..." → 2025.
function refNF(desc){
  var d=String(desc||"");
  var mm={jan:"Jan",fev:"Fev",mar:"Mar",abr:"Abr",mai:"Mai",jun:"Jun",jul:"Jul",ago:"Ago",set:"Set",out:"Out",nov:"Nov",dez:"Dez"};
  var m=d.match(/\[(\d{4})\s+([A-Za-zçÇ]{3,})\]/);
  if(m){ var k=m[2].slice(0,3).toLowerCase().replace("ç","c"); if(mm[k]) return mm[k]+"/"+m[1].slice(2); return m[1]; }
  var m2=d.match(/\[(\d{4})\]/); if(m2) return m2[1];
  var m3=d.match(/\b(20\d{2})\b/); if(m3) return m3[1];
  return "";
}
// Formata a data real da cobrança (Data de recebimento) como Mmm/aa. Aceita dd/mm/aaaa, ISO ou Date.
function fmtDataNF(s){
  if(!s) return "";
  var mm=["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  if(s instanceof Date) return mm[s.getMonth()+1]+"/"+String(s.getFullYear()).slice(2);
  s=String(s);
  var m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return (mm[parseInt(m[2],10)]||m[2])+"/"+m[3].slice(2);
  var m2=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m2) return (mm[parseInt(m2[2],10)]||m2[2])+"/"+m2[1].slice(2);
  return "";
}

// Sub-tipo de cobranca NAO-plano: planilha | camiseta | dropin | outro
function subTipoNF(desc){
  var d=String(desc||"").toLowerCase();
  if(d.indexOf("planilha")>=0) return "planilha";
  if(d.indexOf("camiseta")>=0) return "camiseta";
  if(d.indexOf("drop")>=0) return "dropin";
  return "outro";
}

function classNF(desc){
  var d=String(desc||"").toLowerCase();
  if(/camiseta|camisa|regata|\bshort\b|bon[eé]|garrafa|squeeze|\bmeia\b/.test(d)) return "avulso";
  if(/planilha|perfomance|performance/.test(d)) return "planilha";
  if(/anual|mensal|semestral|trimestral|recorrente|migra|renova|plano|master|cross\s*fit|hyrox|lpo|domingo/.test(d)) return "plano";
  if(/drop\s*in|aula avulsa|day use|experimental|vantagens|aluguel|\bsala\b|locac|\bkit\b|conjunto/.test(d)) return "avulso";
  return "outro";
}

function computeUnifiedBase(){
  var nfAlunos=extractNFAlunos();
  _gpFusoesTemp=[]; _gpPossiveisTemp=[];
  var gpAlunos=extractGPAlunos();
  _gpFusoesTemp.forEach(function(f){fusioesRealizadas.push(f);});
  _gpPossiveisTemp.forEach(function(f){fusoesPossiveis.push(f);});
  var tpAlunos=extractTPAlunos();

  unifiedBase=[];
  fusioesRealizadas=[];   // score >= 0.80 — fundiu
  fusoesPossiveis=[];     // score 0.65-0.79 — não fundiu, mas parecido
  _tpFusoesInternas.forEach(function(f){fusioesRealizadas.push(f);});

  if(!nfAlunos.length&&!gpAlunos.length&&!tpAlunos.length) return;

  var master=[];

  // 1. NextFit como âncora
  nfAlunos.forEach(function(a,i){
    master.push({id:i,nome:a.nome,
      nf:{nome:a.nome,receita:a.receita,plano:a.plano,status:a.status,cobr:a.cobr,cobrancas:a.cobrancas||[],temPlano:!!a.temPlano,temPlanilha:!!a.temPlanilha,temAvulso:!!a.temAvulso},
      gp:null,tp:null,gpSim:0,tpSim:0});
  });

  // 2. Gympass — threshold 0.80
  gpAlunos.forEach(function(gp){
    var bestScore=0,bestIdx=-1;
    master.forEach(function(m,i){
      var s=nameSim(gp.nome,m.nome);
      if(s>bestScore){bestScore=s;bestIdx=i;}
    });
    var perfil=gp.perfil||"esporadico";
    var tendencia=gp.tendencia||"";
    if(bestScore>=0.80&&bestIdx>=0){
      // Fusão realizada
      fusioesRealizadas.push({nomeCanônico:master[bestIdx].nome,nomeFundido:gp.nome,fonteA:"NextFit",fonteB:"Gympass",score:bestScore});
      master[bestIdx].gp={nome:gp.nome,checkins:gp.checkins,receita:gp.receita,perfil:perfil,tendencia:tendencia,datas:gp.datas||[],status:gp.status||"",diasSemVir:(gp.diasSemVir!=null?gp.diasSemVir:null)};
      master[bestIdx].gpSim=bestScore;
    } else {
      // Verificar se há possível fusão (0.65-0.79) para auditoria
      if(bestScore>=0.65&&bestIdx>=0){
        fusoesPossiveis.push({nomeA:gp.nome,fonteA:"Gympass",nomeB:master[bestIdx].nome,fonteB:master[bestIdx].nf?"NextFit":master[bestIdx].gp?"Gympass":"Totalpass",score:bestScore});
      }
      master.push({id:master.length,nome:gp.nome,nf:null,
        gp:{nome:gp.nome,checkins:gp.checkins,receita:gp.receita,perfil:perfil,tendencia:tendencia,datas:gp.datas||[],status:gp.status||"",diasSemVir:(gp.diasSemVir!=null?gp.diasSemVir:null)},
        tp:null,gpSim:1,tpSim:0});
    }
  });

  // 3. Totalpass — threshold 0.80
  tpAlunos.forEach(function(tp){
    var bestScore=0,bestIdx=-1;
    master.forEach(function(m,i){
      var s=nameSim(tp.nome,m.nome);
      if(s>bestScore){bestScore=s;bestIdx=i;}
    });
    var tpObj={nome:tp.nome,receita:tp.receita,meses:tp.meses,perfil:tp.perfil,
      tendencia:tp.tendencia||"",status:tp.status||"",checkins:tp.checkins||0,
      datas:tp.datas||[],mesChk:tp.mesChk||[0,0,0,0,0,0],ult:tp.ult||null,diasSemVir:(tp.diasSemVir!=null?tp.diasSemVir:null)};
    if(bestScore>=0.80&&bestIdx>=0){
      fusioesRealizadas.push({nomeCanônico:master[bestIdx].nome,nomeFundido:tp.nome,fonteA:master[bestIdx].nf?"NextFit":"Gympass",fonteB:"Totalpass",score:bestScore});
      master[bestIdx].tp=tpObj;
      master[bestIdx].tpSim=bestScore;
    } else {
      if(bestScore>=0.65&&bestIdx>=0){
        fusoesPossiveis.push({nomeA:tp.nome,fonteA:"Totalpass",nomeB:master[bestIdx].nome,fonteB:master[bestIdx].nf?"NextFit":master[bestIdx].gp?"Gympass":"Totalpass",score:bestScore});
      }
      master.push({id:master.length,nome:tp.nome,nf:null,gp:null,
        tp:tpObj,
        gpSim:0,tpSim:1});
    }
  });

  // 4. Calcular perfil consolidado e situação de cada aluno
  master.forEach(function(m){
    // Perfil: pega o melhor entre as fontes pass
    var perfs=[];
    if(m.gp) perfs.push(m.gp.perfil);
    if(m.tp) perfs.push(m.tp.perfil);
    var order={fiel:3,regular:2,esporadico:1,fds:0};
    var bestPerf=perfs.length?perfs.reduce(function(a,b){return order[a]>=order[b]?a:b;}):"";
    m.perfil=bestPerf||"";

    // Recência consolidada (dia a dia — Gympass + Totalpass agora ambos têm data)
    function mesArr(datas){ var a=[0,0,0,0,0,0]; (datas||[]).forEach(function(d){ var mm=d.getMonth(); if(mm>=0&&mm<6) a[mm]++; }); return a; }
    var dsGP=(m.gp&&m.gp.datas)||[]; var dsTP=(m.tp&&m.tp.datas)||[];
    m.gpMes=mesArr(dsGP); m.tpMes=(m.tp&&m.tp.mesChk)?m.tp.mesChk:mesArr(dsTP);
    // Tendência: COMBINADA (Gympass + Totalpass) por recência = headline; por plataforma = detalhe do popup
    var combMes=m.gpMes.map(function(v,i){return v+m.tpMes[i];});
    m.tendencia=trendRecencia(combMes);
    m.gpTend=m.gp?trendRecencia(m.gpMes):"";
    m.tpTend=m.tp?trendRecencia(m.tpMes):"";
    var todas=dsGP.concat(dsTP);
    var ult=null; todas.forEach(function(d){ if(!ult||d>ult) ult=d; });
    m.ultimaVisita=ult;
    if(ult){ var dd=Math.floor((new Date()-ult)/86400000); m.diasSemVir=dd; m.statusRec=dd<=35?"ativo":dd<=65?"em_risco":"inativo"; }
    else { m.diasSemVir=null; m.statusRec=""; }
    // Só fim de semana: 2+ visitas, todas em sábado/domingo
    m.wkonly = todas.length>=2 && todas.every(function(d){ var w=d.getDay(); return w===0||w===6; });

    // Situação — o que interessa estrategicamente
    var isFds=m.wkonly || ((m.gp&&m.gp.perfil==="fds")&&(!m.tp||m.tp.perfil==="fds"));
    if(m.nf&&!m.gp&&!m.tp)                       m.situacao="so_direto";
    else if(m.nf&&m.nf.temPlano&&(m.gp||m.tp))   m.situacao="multiplas";
    else if((m.gp||m.tp)&&!isFds)                m.situacao="candidato";
    else                                          m.situacao="fds_apenas";

    // Score de confiança — só relevante quando aparece em 2+ fontes com match fuzzy
    var fontes=(m.nf?1:0)+(m.gp?1:0)+(m.tp?1:0);
    if(fontes<2){
      m.matchConf=1; // só uma fonte — sem match para avaliar
    } else {
      var sims=[];
      if(m.nf&&m.gp&&m.gpSim>0&&m.gpSim<1) sims.push(m.gpSim);
      if(m.nf&&m.tp&&m.tpSim>0&&m.tpSim<1) sims.push(m.tpSim);
      if(m.gp&&m.tp&&m.tpSim>0&&m.tpSim<1) sims.push(m.tpSim);
      m.matchConf=sims.length?Math.min.apply(null,sims):1;
    }
  });

  // Ordenar: candidatos fiéis primeiro, depois múltiplas fontes, depois só direto
  var situOrder={candidato:3,multiplas:2,so_direto:1,fds_apenas:0,indefinido:0};
  var perfilOrder={fiel:3,regular:2,esporadico:1,"":0};
  master.sort(function(a,b){
    var sd=situOrder[b.situacao]-situOrder[a.situacao];
    if(sd!==0) return sd;
    return perfilOrder[b.perfil]-perfilOrder[a.perfil];
  });

  unifiedBase=master;
}
